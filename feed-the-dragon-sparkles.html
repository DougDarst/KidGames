<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Feed the Dragon</title>
<link rel="stylesheet" href="shared/kit.css?v=1">
<style>
  html, body {
    height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Rounded, sans-serif;
    color: #fff;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background: linear-gradient(135deg,#1a0040,#0a1560,#2d0060,#0a1560,#1a0040);
    background-size: 400% 400%;
    animation: bgShift 12s ease infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .top-bar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 8px;
    z-index: 1;
  }
  .back-btn { min-width: 80px; text-align: center; }
  .top-bar h1 {
    font-size: clamp(16px, 4vw, 22px);
    font-weight: 700;
    letter-spacing: 0.5px;
    text-align: center;
    flex: 1;
  }
  .top-spacer { min-width: 80px; }

  .game {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 420px;
    gap: 10px;
    z-index: 1;
    flex: 1;
    padding: 0 12px;
    min-height: 0;
  }

  .score-row {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }
  .player-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 10px 8px;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    border: 2px solid transparent;
    transition: all 0.25s ease;
  }
  .player-card.active {
    border-color: #ffd700;
    transform: scale(1.04);
  }
  .player-card .avatar { font-size: 30px; }
  .player-card .pname { font-size: 14px; font-weight: 600; }
  .player-card .pscore { font-size: 20px; font-weight: 700; color: #ffd700; }

  .vs-badge { font-size: 18px; opacity: 0.45; font-weight: 700; flex-shrink: 0; }

  .status-pill {
    width: 100%;
    text-align: center;
    padding: 10px 20px;
    border-radius: 50px;
    background: rgba(255,255,255,0.1);
    font-size: clamp(14px, 3.5vw, 17px);
    font-weight: 600;
  }

  .stage {
    flex: 1;
    width: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }

  .mound {
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 70%; height: 55px;
    background: rgba(111,214,163,0.18);
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  }

  .dragon-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
  }

  .cheek-glow {
    position: absolute;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,111,160,0.55), rgba(255,111,160,0));
    transition: all 0.35s ease;
    opacity: 0.2;
  }

  .dragon {
    font-size: clamp(76px, 20vw, 108px);
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 10px 12px rgba(0,0,0,0.5));
    transition: transform 0.3s ease;
  }
  .dragon.gulp { animation: gulp 0.3s ease; }
  @keyframes gulp {
    0% { transform: scale(1); }
    40% { transform: scale(1.12, 0.9); }
    100% { transform: scale(1); }
  }
  .dragon.shake { animation: shake 0.6s ease; }
  @keyframes shake {
    0%,100% { transform: rotate(0deg); }
    20% { transform: rotate(-6deg); }
    40% { transform: rotate(6deg); }
    60% { transform: rotate(-8deg); }
    80% { transform: rotate(8deg); }
  }

  .sparkle-orbit { position: absolute; inset: -40px; pointer-events: none; }
  .sparkle-orbit span {
    position: absolute;
    font-size: 18px;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .candy-pile { position: absolute; bottom: 8px; font-size: 24px; }

  .flying-candy {
    position: fixed;
    font-size: 56px;
    z-index: 50;
    pointer-events: none;
  }
  .flying-candy.draggable-candy {
    pointer-events: all;
    cursor: grab;
    touch-action: none;
    animation: candyPulse 0.8s ease infinite alternate;
  }
  .flying-candy.draggable-candy.dragging {
    cursor: grabbing;
    animation: none;
  }
  @keyframes candyPulse {
    from { filter: drop-shadow(0 4px 8px rgba(255,200,0,0.4)); transform: translate(-50%,-50%) scale(1); }
    to   { filter: drop-shadow(0 6px 16px rgba(255,200,0,0.85)); transform: translate(-50%,-50%) scale(1.1); }
  }

  .controls {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding-bottom: 22px;
  }

  .die {
    width: 72px; height: 72px;
    border-radius: 18px;
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 700;
    color: #ffd700;
  }
  .die.rolling { animation: rollspin 0.08s linear infinite; }
  @keyframes rollspin {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(8deg) scale(1.05); }
    100% { transform: rotate(-8deg) scale(1); }
  }
  .new-game-btn { font-family: inherit; width: 100%; touch-action: none; }
  .new-game-btn:active { opacity: 0.75; }
  .new-game-btn:disabled { opacity: 0.35; cursor: default; }
  .play-again-btn { font-family: inherit; touch-action: none; }
  .play-again-btn:active { opacity: 0.85; }

  .hint-text { font-size: 13px; opacity: 0.5; text-align: center; }
  .result-card { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .result-emoji { font-size: 54px; }
  .result-msg { opacity: 0.85; line-height: 1.5; }
</style>
</head>
<body>

<div id="stars"></div>

<div class="top-bar">
  <a class="back-btn" href="index.html">← Games</a>
  <h1>🐉 Feed the Dragon</h1>
  <div class="top-spacer"></div>
</div>

<div class="game">
  <div class="score-row">
    <div class="player-card" id="cardEllie">
      <div class="avatar">👧</div>
      <div class="pname">Ellie</div>
      <div class="pscore" id="ellieScore">🏆 0</div>
    </div>
    <div class="vs-badge">vs</div>
    <div class="player-card" id="cardGrandpa">
      <div class="avatar">👴</div>
      <div class="pname">Grandpa</div>
      <div class="pscore" id="grandpaScore">🏆 0</div>
    </div>
  </div>

  <div class="status-pill" id="statusPill">Ellie's turn — roll the die!</div>

  <div class="stage">
    <div class="mound"></div>
    <div class="dragon-wrap" id="dragonWrap">
      <div class="cheek-glow" id="cheekGlow"></div>
      <div class="sparkle-orbit" id="sparkleOrbit">
        <span style="top:0;left:50%;">✨</span>
        <span style="top:30%;left:0;">⭐</span>
        <span style="top:30%;right:0;left:auto;">⭐</span>
        <span style="bottom:10%;left:20%;">✨</span>
        <span style="bottom:10%;right:20%;left:auto;">✨</span>
        <span style="top:60%;left:-10%;">💫</span>
        <span style="top:60%;right:-10%;left:auto;">💫</span>
      </div>
      <div class="dragon" id="dragon">🐉</div>
    </div>
    <div class="candy-pile">🍬🍭🍬🍭🍬</div>
  </div>

  <div class="controls">
    <div class="die" id="die">?</div>
    <button class="new-game-btn" id="rollBtn" onclick="rollDie()">🎲 Roll the Die</button>
    <div class="hint-text" id="hintText">Tap the button to take your turn!</div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="result-card">
    <div class="result-emoji">🤧</div>
    <div class="result-title" id="resultTitle">ACHOO!</div>
    <div class="result-msg" id="resultMsg"></div>
    <button class="play-again-btn" onclick="playAgain()">Play Again</button>
  </div>
</div>

<div class="confetti-wrap" id="confetti"></div>

<script src="shared/kit.js?v=1"></script>
<script>
  const SNEEZE_AT = 20;
  let total = 0;
  let currentPlayer = 'ellie';
  let startingPlayer = 'ellie';
  let pendingRoll = 0;
  let fed = 0;
  let trophies = { ellie: 0, grandpa: 0 };
  let busy = false;

  const dragon = document.getElementById('dragon');
  const dragonWrap = document.getElementById('dragonWrap');
  const cheekGlow = document.getElementById('cheekGlow');
  const sparkleOrbit = document.getElementById('sparkleOrbit');
  const die = document.getElementById('die');
  const rollBtn = document.getElementById('rollBtn');
  const statusPill = document.getElementById('statusPill');
  const hintText = document.getElementById('hintText');

  function playerName(p) { return p === 'ellie' ? 'Ellie' : 'Grandpa'; }

  function updateCards() {
    document.getElementById('cardEllie').classList.toggle('active', currentPlayer === 'ellie');
    document.getElementById('cardGrandpa').classList.toggle('active', currentPlayer === 'grandpa');
  }

  function updateScores() {
    document.getElementById('ellieScore').textContent = '🏆 ' + trophies.ellie;
    document.getElementById('grandpaScore').textContent = '🏆 ' + trophies.grandpa;
  }

  function updateDragonVisual() {
    const pct = Math.min(total / SNEEZE_AT, 1);
    dragonWrap.style.transform = `scale(${1 + pct * 0.55})`;
    cheekGlow.style.opacity = 0.15 + pct * 0.55;
    cheekGlow.style.width = (140 + pct * 60) + 'px';
    cheekGlow.style.height = (140 + pct * 60) + 'px';
    const sparkles = sparkleOrbit.querySelectorAll('span');
    const showCount = Math.round(pct * sparkles.length);
    sparkles.forEach((s, i) => { s.style.opacity = i < showCount ? 1 : 0; });
  }

  function setStatus() {
    statusPill.textContent = `${playerName(currentPlayer)}'s turn — roll the die!`;
  }

  const gulpTone = () => Kit.tone(300 + Math.random()*80, 0.09, 'triangle', 0.12);

  function boomSound() {
    try {
      const audioCtx = Kit.audio();
      const dur = audioCtx.sampleRate * 0.6;
      const buf = audioCtx.createBuffer(1, dur, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < dur; i++) d[i] = (Math.random()*2-1) * Math.exp(-i/(audioCtx.sampleRate*0.12));
      const src = audioCtx.createBufferSource(); src.buffer = buf;
      const filt = audioCtx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 200;
      const g = audioCtx.createGain(); g.gain.value = 1.0;
      src.connect(filt); filt.connect(g); g.connect(audioCtx.destination);
      src.start();
      Kit.tone(55, 0.6, 'sine', 0.5);
      Kit.tone(80, 0.4, 'triangle', 0.3);
    } catch(e) {}
  }

  function explodeDragon() {
    // Flash
    const flash = document.createElement('div');
    flash.style.cssText = 'position:fixed;inset:0;background:rgba(255,240,180,0.92);z-index:400;pointer-events:none';
    document.body.appendChild(flash);
    flash.animate([{opacity:1},{opacity:0}], {duration:500, easing:'ease-out'}).onfinish = () => flash.remove();

    // Hide dragon
    dragon.style.transition = 'none';
    dragon.style.opacity = '0';

    // Pieces flying out from dragon center
    const rect = dragon.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const pieces = ['🐉','🐉','🐉','🐉','🔥','🔥','🔥','💥','💥','✨','✨','💫'];
    pieces.forEach((emoji, i) => {
      const el = document.createElement('div');
      el.style.cssText = `position:fixed;font-size:${28+Math.random()*38}px;left:${cx}px;top:${cy}px;z-index:350;pointer-events:none;transform:translate(-50%,-50%)`;
      el.textContent = emoji;
      document.body.appendChild(el);
      const angle = (i / pieces.length) * Math.PI * 2 + (Math.random()-0.5)*0.4;
      const dist = 90 + Math.random() * 180;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;
      const spin = (Math.random()-0.5) * 720;
      el.animate([
        { transform: 'translate(-50%,-50%) scale(1.4) rotate(0deg)', opacity: 1 },
        { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.1) rotate(${spin}deg)`, opacity: 0 }
      ], { duration: 900 + Math.random()*500, easing: 'ease-out' }).onfinish = () => el.remove();
    });
  }

  function rollDie() {
    if (busy) return;
    busy = true;
    rollBtn.disabled = true;
    die.classList.add('rolling');
    let ticks = 0;
    const spin = setInterval(() => {
      die.textContent = 1 + Math.floor(Math.random()*6);
      ticks++;
      if (ticks > 10) {
        clearInterval(spin);
        pendingRoll = 1 + Math.floor(Math.random()*6);
        fed = 0;
        die.textContent = pendingRoll;
        die.classList.remove('rolling');
        rollBtn.style.display = 'none';
        statusPill.textContent = `${playerName(currentPlayer)} rolled a ${pendingRoll}!`;
        hintText.textContent = 'Drag a candy up to the dragon!';
        setTimeout(showNextCandy, 700);
      }
    }, 70);
  }

  function isNearDragon(px, py) {
    const r = dragon.getBoundingClientRect();
    const pad = 55;
    return px >= r.left - pad && px <= r.right + pad &&
           py >= r.top - pad && py <= r.bottom + pad;
  }

  function showNextCandy() {
    if (total >= SNEEZE_AT || fed >= pendingRoll) {
      afterFeeding();
      return;
    }
    const remaining = pendingRoll - fed;
    statusPill.textContent = remaining === 1
      ? `Last candy — drag it to the dragon! 🐉`
      : `Drag ${remaining} candies to the dragon!`;

    const pileRect = document.querySelector('.candy-pile').getBoundingClientRect();
    const startX = pileRect.left + pileRect.width / 2;
    const startY = pileRect.top + pileRect.height / 2;

    const candy = document.createElement('div');
    candy.className = 'flying-candy draggable-candy';
    candy.textContent = ['🍬','🍭','🍡'][fed % 3];
    candy.style.left = startX + 'px';
    candy.style.top  = startY + 'px';
    candy.style.transform = 'translate(-50%,-50%) scale(0)';
    document.body.appendChild(candy);

    /* pop in */
    requestAnimationFrame(() => {
      candy.style.transition = 'transform 0.25s cubic-bezier(.34,1.56,.64,1)';
      candy.style.transform  = 'translate(-50%,-50%) scale(1)';
      setTimeout(() => { candy.style.transition = ''; }, 260);
    });

    let dragging = false, ptId = null;

    candy.addEventListener('pointerdown', e => {
      dragging = true;
      ptId = e.pointerId;
      candy.setPointerCapture(e.pointerId);
      candy.classList.add('dragging');
      candy.style.transition = '';
      candy.style.transform  = 'translate(-50%,-50%) scale(1.3)';
      candy.style.zIndex     = '60';
      e.preventDefault();
    });

    candy.addEventListener('pointermove', e => {
      if (!dragging || e.pointerId !== ptId) return;
      candy.style.left = e.clientX + 'px';
      candy.style.top  = e.clientY + 'px';
      /* glow dragon when nearby */
      dragon.style.filter = isNearDragon(e.clientX, e.clientY)
        ? 'drop-shadow(0 0 22px rgba(255,215,0,0.95))'
        : 'drop-shadow(0 10px 12px rgba(0,0,0,0.5))';
      e.preventDefault();
    });

    candy.addEventListener('pointerup', e => {
      if (!dragging || e.pointerId !== ptId) return;
      dragging = false;
      dragon.style.filter = '';
      candy.classList.remove('dragging');

      if (isNearDragon(e.clientX, e.clientY)) {
        /* success: shrink into dragon */
        const r = dragon.getBoundingClientRect();
        candy.style.transition = 'left 0.15s ease-in, top 0.15s ease-in, transform 0.15s ease-in, opacity 0.15s';
        candy.style.left    = (r.left + r.width  / 2) + 'px';
        candy.style.top     = (r.top  + r.height / 2) + 'px';
        candy.style.transform = 'translate(-50%,-50%) scale(0.2)';
        candy.style.opacity = '0';
        setTimeout(() => {
          candy.remove();
          total++;
          fed++;
          gulpTone();
          dragon.classList.remove('gulp'); void dragon.offsetWidth; dragon.classList.add('gulp');
          updateDragonVisual();
          if (total >= SNEEZE_AT) {
            setTimeout(afterFeeding, 500);
          } else {
            setTimeout(showNextCandy, 420);
          }
        }, 150);
      } else {
        /* miss: bounce back to pile */
        candy.style.transition = 'left 0.35s cubic-bezier(.34,1.56,.64,1), top 0.35s cubic-bezier(.34,1.56,.64,1), transform 0.35s ease';
        candy.style.left      = startX + 'px';
        candy.style.top       = startY + 'px';
        candy.style.transform = 'translate(-50%,-50%) scale(1)';
        setTimeout(() => { candy.style.transition = ''; }, 360);
      }
      e.preventDefault();
    });
  }

  function afterFeeding() {
    if (total >= SNEEZE_AT) {
      triggerSneeze();
    } else {
      currentPlayer = currentPlayer === 'ellie' ? 'grandpa' : 'ellie';
      updateCards();
      setStatus();
      hintText.textContent = 'Tap the button to take your turn!';
      rollBtn.style.display = 'inline-block';
      rollBtn.disabled = false;
      die.textContent = '?';
      busy = false;
    }
  }

  function triggerSneeze() {
    boomSound();
    explodeDragon();
    Kit.confetti();
    const feeder = currentPlayer;
    const winner = feeder === 'ellie' ? 'grandpa' : 'ellie';
    trophies[winner]++;
    updateScores();
    setTimeout(() => {
      document.getElementById('resultTitle').textContent = '🎉 ACHOO! 🎉';
      document.getElementById('resultMsg').textContent =
        `${playerName(feeder)}'s candy was one too many — the dragon exploded with glitter! ${playerName(winner)} wins this round!`;
      document.getElementById('overlay').classList.add('show');
    }, 1400);
  }

  function playAgain() {
    total = 0;
    fed = 0;
    dragon.style.opacity = '1';
    dragon.style.transition = '';
    dragonWrap.style.transform = '';
    updateDragonVisual();
    document.getElementById('overlay').classList.remove('show');
    startingPlayer = startingPlayer === 'ellie' ? 'grandpa' : 'ellie';
    currentPlayer = startingPlayer;
    updateCards();
    setStatus();
    hintText.textContent = 'Tap the button to take your turn!';
    die.textContent = '?';
    rollBtn.style.display = 'inline-block';
    rollBtn.disabled = false;
    busy = false;
  }

  updateCards();
  updateScores();
  updateDragonVisual();
  setStatus();
</script>
</body>
</html>
