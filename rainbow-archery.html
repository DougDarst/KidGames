<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rainbow Archery</title>
<link rel="stylesheet" href="shared/kit.css?v=1">
<style>
  html, body {
    height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Rounded, sans-serif;
    color: #fff;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background: linear-gradient(135deg,#1a0040,#0a1560,#2d0060,#0a1560,#1a0040);
    background-size: 400% 400%;
    animation: bgShift 12s ease infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .top-bar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 8px;
    z-index: 1;
    flex-shrink: 0;
  }
  .back-btn { min-width: 80px; text-align: center; }
  .top-bar h1 {
    font-size: clamp(16px, 4vw, 22px);
    font-weight: 700;
    text-align: center;
    flex: 1;
  }
  .top-spacer { min-width: 80px; }

  .stats-row {
    width: 100%;
    max-width: 420px;
    display: flex;
    gap: 10px;
    padding: 0 12px 8px;
    z-index: 1;
    flex-shrink: 0;
  }
  .stat-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
  }
  .stat-card .slabel { font-size: 11px; opacity: 0.6; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
  .stat-card .svalue { font-size: 20px; font-weight: 700; color: #ffd700; }
  .arrows-row { display: flex; gap: 3px; font-size: 16px; }
  .arrows-row span.used { opacity: 0.22; }

  /* Stage */
  .stage {
    flex: 1;
    position: relative;
    background: linear-gradient(180deg, #6fc6ff 0%, #d6f3ff 75%);
    overflow: hidden;
    width: 100%;
    z-index: 1;
    touch-action: none;
  }
  .cloud {
    position: absolute;
    background: #fff;
    border-radius: 50px;
    opacity: 0.85;
  }
  .ground {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 70px;
    background: #7fd6a3;
    border-radius: 50% 50% 0 0 / 30px 30px 0 0;
  }

  /* Target */
  .target {
    position: absolute;
    top: 55px;
    width: 100px; height: 100px;
    margin-left: -50px;
    border-radius: 50%;
    box-shadow: 0 6px 10px rgba(0,0,0,0.15);
    transition: transform 0.15s ease;
  }
  .ring { position: absolute; border-radius: 50%; inset: 0; }
  .ring.r1 { background: #a78bfa; }
  .ring.r2 { inset: 12px; background: #4cc9f0; }
  .ring.r3 { inset: 24px; background: #6ee7b7; }
  .ring.r4 { inset: 36px; background: #ffd166; }
  .ring.r5 { inset: 48px; background: #ff4f8b; }
  .target.hitflash { transform: scale(1.25); }

  /* Bow / arrow */
  .bow-anchor { position: absolute; width: 4px; height: 4px; }
  .bow-shape {
    position: absolute;
    width: 120px; height: 44px;
    border: 6px solid #4a3f55;
    border-bottom: none;
    border-radius: 60px 60px 0 0 / 44px 44px 0 0;
    left: -60px; top: -44px;
    opacity: 0.85;
  }
  .bow-string {
    position: absolute;
    width: 120px; height: 2px;
    background: rgba(74,63,85,0.4);
    left: -60px; top: -1px;
  }

  .arrow-svg {
    position: absolute;
    width: 90px; height: 16px;
    left: -45px; top: -8px;
    transform-origin: 75% 50%;
    pointer-events: none;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
  }
  .arrow-svg.pulsing { animation: invitePulse 1.4s ease-in-out infinite; transform-origin: 50% 50%; }
  @keyframes invitePulse {
    0%,100% { filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2)); }
    50% { filter: drop-shadow(0 2px 10px rgba(255,111,160,0.7)); }
  }

  .aim-line {
    position: absolute;
    height: 2px;
    background: repeating-linear-gradient(90deg, #ff4f8b 0 8px, transparent 8px 16px);
    transform-origin: left center;
    opacity: 0;
    pointer-events: none;
  }

  .flying-arrow {
    position: absolute;
    width: 90px; height: 16px;
    pointer-events: none;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
  }

  .hint-banner {
    position: absolute;
    top: 175px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
    color: #4a3f55;
    background: rgba(255,255,255,0.88);
    padding: 6px 16px;
    border-radius: 999px;
    opacity: 0.85;
    text-align: center;
    white-space: nowrap;
  }
  .result-card { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .result-emoji { font-size: 54px; }
  .result-msg { opacity: 0.85; }
  .play-again-btn { font-family: inherit; touch-action: none; }
  .play-again-btn:active { opacity: 0.85; }
</style>
</head>
<body>

<div id="stars"></div>

<div class="top-bar">
  <a class="back-btn" href="index.html">← Games</a>
  <h1>🏹 Rainbow Archery</h1>
  <div class="top-spacer"></div>
</div>

<div class="stats-row">
  <div class="stat-card">
    <div class="slabel">Arrows</div>
    <div class="arrows-row" id="arrowsLeft"></div>
  </div>
  <div class="stat-card">
    <div class="slabel">Score</div>
    <div class="svalue" id="scorePill">🎯 0</div>
  </div>
</div>

<div class="stage" id="stage">
  <div class="cloud" style="width:100px;height:36px;top:5%;left:8%;"></div>
  <div class="cloud" style="width:70px;height:26px;top:10%;left:72%;"></div>

  <div class="target" id="target">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="ring r4"></div>
    <div class="ring r5"></div>
  </div>

  <div class="hint-banner" id="hintBanner">Pull the arrow back, then let go to shoot! 🏹</div>
  <div class="aim-line" id="aimLine"></div>

  <div class="bow-anchor" id="bowAnchor">
    <div class="bow-shape"></div>
    <div class="bow-string" id="bowString"></div>
    <svg class="arrow-svg pulsing" id="arrow" viewBox="0 0 90 16">
      <line x1="4" y1="8" x2="70" y2="8" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/>
      <polygon points="70,1 88,8 70,15" fill="#4a3f55"/>
      <polygon points="4,8 16,2 16,14" fill="#ff6fa0"/>
    </svg>
  </div>

  <div class="ground"></div>
</div>

<div class="overlay" id="overlay">
  <div class="result-card">
    <div class="result-emoji" id="resultEmoji">🎯</div>
    <div class="result-title" id="resultTitle">Great Shooting!</div>
    <div class="result-msg" id="resultMsg"></div>
    <button class="play-again-btn" onclick="resetGame()">Play Again</button>
  </div>
</div>

<div class="confetti-wrap" id="confetti"></div>

<script src="shared/kit.js?v=1"></script>
<script>
  const TOTAL_ARROWS = 5;
  const MAX_PULL = 120;
  const MIN_PULL_TO_FIRE = 18;
  const HIT_RADIUS = 38;

  const stage = document.getElementById('stage');
  const target = document.getElementById('target');
  const bowAnchor = document.getElementById('bowAnchor');
  const bowString = document.getElementById('bowString');
  const arrow = document.getElementById('arrow');
  const aimLine = document.getElementById('aimLine');
  const arrowsLeftEl = document.getElementById('arrowsLeft');
  const scorePill = document.getElementById('scorePill');
  const hintBanner = document.getElementById('hintBanner');
  const overlay = document.getElementById('overlay');

  let arrowsRemaining = TOTAL_ARROWS;
  let score = 0;
  let aiming = false;
  let gameOver = false;
  let anchorX, anchorY;
  let targetX, targetVX, targetMinX, targetMaxX;
  let flyingArrows = [];

  function layout() {
    const rect = stage.getBoundingClientRect();
    anchorX = rect.width / 2;
    anchorY = rect.height - 100;
    bowAnchor.style.left = anchorX + 'px';
    bowAnchor.style.top = anchorY + 'px';
    targetMinX = 70;
    targetMaxX = rect.width - 70;
    if (targetX === undefined) targetX = rect.width / 2;
    targetX = Math.min(Math.max(targetX, targetMinX), targetMaxX);
    target.style.left = targetX + 'px';
  }

  function initArrowIcons() {
    arrowsLeftEl.innerHTML = '';
    for (let i = 0; i < TOTAL_ARROWS; i++) {
      const s = document.createElement('span');
      s.textContent = '🏹';
      arrowsLeftEl.appendChild(s);
    }
  }
  function updateArrowIcons() {
    const spans = arrowsLeftEl.querySelectorAll('span');
    spans.forEach((s, i) => s.classList.toggle('used', i >= arrowsRemaining));
  }

  targetVX = 2.4;
  let lastSpeedChange = performance.now();
  function animateTarget(ts) {
    if (!gameOver) {
      targetX += targetVX;
      if (targetX <= targetMinX || targetX >= targetMaxX) {
        targetVX *= -1;
        targetX = Math.min(Math.max(targetX, targetMinX), targetMaxX);
      }
      if (ts - lastSpeedChange > 1200) {
        lastSpeedChange = ts;
        const dir = Math.random() < 0.5 ? -1 : 1;
        targetVX = dir * (1.6 + Math.random() * 2.4);
      }
      target.style.left = targetX + 'px';
    }
    requestAnimationFrame(animateTarget);
  }

  const twangTone = () => Kit.tone(200 + Math.random()*40, 0.12, 'triangle', 0.12);
  const hitChime = () => { Kit.tone(659,0.1); setTimeout(()=>Kit.tone(880,0.12),80); setTimeout(()=>Kit.tone(1046,0.16),160); };
  const missTone = () => Kit.tone(160, 0.15, 'sawtooth', 0.08);

  function getPointerPos(e) {
    const rect = stage.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function updateAimVisual(dx, dy, dist) {
    const clampedDist = Math.min(dist, MAX_PULL);
    const ux = dist === 0 ? 0 : dx / dist;
    const uy = dist === 0 ? -1 : dy / dist;
    const pulledX = anchorX + ux * clampedDist;
    const pulledY = anchorY + uy * clampedDist;
    const fireAngleRad = Math.atan2(-uy, -ux);
    const fireAngleDeg = fireAngleRad * 180 / Math.PI;

    arrow.style.left = (pulledX - 45) + 'px';
    arrow.style.top = (pulledY - 8) + 'px';
    arrow.style.transform = `rotate(${fireAngleDeg}deg)`;
    arrow.classList.remove('pulsing');
    bowString.style.left = 'unset';
    bowString.style.height = 'unset';

    if (dist > MIN_PULL_TO_FIRE) {
      aimLine.style.opacity = Math.min(0.3 + (clampedDist / MAX_PULL) * 0.6, 0.85);
      aimLine.style.width = '600px';
      aimLine.style.left = anchorX + 'px';
      aimLine.style.top = anchorY + 'px';
      aimLine.style.transform = `rotate(${fireAngleDeg}deg)`;
    } else {
      aimLine.style.opacity = 0;
    }
  }

  function resetArrowVisual() {
    arrow.style.left = '-45px';
    arrow.style.top = '-8px';
    arrow.style.transform = 'rotate(-90deg)';
    arrow.classList.add('pulsing');
    aimLine.style.opacity = 0;
  }

  stage.addEventListener('pointerdown', (e) => {
    if (gameOver || arrowsRemaining <= 0 || flyingArrows.length > 0) return;
    aiming = true;
    stage.setPointerCapture(e.pointerId);
    hintBanner.style.opacity = 0;
  });

  stage.addEventListener('pointermove', (e) => {
    if (!aiming) return;
    const pos = getPointerPos(e);
    const dx = pos.x - anchorX;
    const dy = pos.y - anchorY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    updateAimVisual(dx, dy, dist);
  });

  function endAim(e) {
    if (!aiming) return;
    aiming = false;
    const pos = getPointerPos(e);
    const dx = pos.x - anchorX;
    const dy = pos.y - anchorY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist >= MIN_PULL_TO_FIRE) {
      fireArrow(dx, dy, dist);
    } else {
      resetArrowVisual();
    }
  }
  stage.addEventListener('pointerup', endAim);
  stage.addEventListener('pointercancel', endAim);

  function fireArrow(dx, dy, dist) {
    twangTone();
    const clampedDist = Math.min(dist, MAX_PULL);
    const ux = dist === 0 ? 0 : dx / dist;
    const uy = dist === 0 ? -1 : dy / dist;
    const fireUX = -ux, fireUY = -uy;
    const speed = 7 + (clampedDist / MAX_PULL) * 9;
    const angleDeg = Math.atan2(fireUY, fireUX) * 180 / Math.PI;

    arrowsRemaining--;
    updateArrowIcons();

    const el = document.createElement('div');
    el.className = 'flying-arrow';
    el.innerHTML = `<svg viewBox="0 0 90 16" width="90" height="16">
      <line x1="4" y1="8" x2="70" y2="8" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/>
      <polygon points="70,1 88,8 70,15" fill="#4a3f55"/>
      <polygon points="4,8 16,2 16,14" fill="#ff6fa0"/>
    </svg>`;
    el.style.transform = `rotate(${angleDeg}deg)`;
    stage.appendChild(el);

    const state = { el, x: anchorX, y: anchorY, ux: fireUX, uy: fireUY, speed, alive: true };
    flyingArrows.push(state);
    resetArrowVisual();
    arrow.style.opacity = arrowsRemaining > 0 ? 1 : 0;
    positionFlyingArrow(state);
  }

  function positionFlyingArrow(state) {
    state.el.style.left = (state.x - 45) + 'px';
    state.el.style.top = (state.y - 8) + 'px';
  }

  function stepFlyingArrows() {
    const stageRect = stage.getBoundingClientRect();
    flyingArrows.forEach(state => {
      if (!state.alive) return;
      state.x += state.ux * state.speed;
      state.y += state.uy * state.speed;
      positionFlyingArrow(state);

      const dxT = state.x - targetX;
      const dyT = state.y - 105;
      const distT = Math.sqrt(dxT*dxT + dyT*dyT);

      if (distT <= HIT_RADIUS) {
        state.alive = false;
        onHit(state);
      } else if (state.y < -20 || state.x < -50 || state.x > stageRect.width + 50) {
        state.alive = false;
        onMiss(state);
      }
    });
    flyingArrows = flyingArrows.filter(s => s.alive);
    requestAnimationFrame(stepFlyingArrows);
  }

  function onHit(state) {
    hitChime();
    state.el.remove();
    score++;
    scorePill.textContent = '🎯 ' + score;
    target.classList.add('hitflash');
    setTimeout(() => target.classList.remove('hitflash'), 200);
    Kit.confetti(30);
    checkRoundEnd();
  }

  function onMiss(state) {
    missTone();
    state.el.remove();
    checkRoundEnd();
  }

  function checkRoundEnd() {
    if (arrowsRemaining <= 0) {
      setTimeout(showGameOver, 600);
    } else {
      hintBanner.style.opacity = 0.85;
    }
  }

  function showGameOver() {
    gameOver = true;
    const perfect = score === TOTAL_ARROWS;
    document.getElementById('resultEmoji').textContent = perfect ? '🌟' : '🎯';
    document.getElementById('resultTitle').textContent = perfect ? 'Perfect Score!' : 'Great Shooting!';
    document.getElementById('resultMsg').textContent = `You hit ${score} out of ${TOTAL_ARROWS} targets!`;
    overlay.classList.add('show');
    if (perfect) Kit.confetti(70);
  }

  function resetGame() {
    arrowsRemaining = TOTAL_ARROWS;
    score = 0;
    gameOver = false;
    scorePill.textContent = '🎯 0';
    updateArrowIcons();
    overlay.classList.remove('show');
    resetArrowVisual();
    arrow.style.opacity = 1;
    hintBanner.style.opacity = 0.85;
    flyingArrows.forEach(s => s.el.remove());
    flyingArrows = [];
  }

  window.addEventListener('resize', layout);
  layout();
  initArrowIcons();
  resetArrowVisual();
  requestAnimationFrame(animateTarget);
  requestAnimationFrame(stepFlyingArrows);
</script>
</body>
</html>
