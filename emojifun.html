<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐶 Emoji Fun — Ellie &amp; Grandpa</title>
    <link rel="stylesheet" href="shared/kit.css?v=1">
    <style>
        html, body { height:100%; height:100dvh; overflow:hidden; }

        body {
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Rounded,sans-serif;
            background:linear-gradient(135deg,#1a0040,#0a1560,#2d0060,#0a1560,#1a0040);
            background-size:400% 400%;
            animation:bgShift 12s ease infinite;
            display:flex; flex-direction:column;
            color:white;
        }

        /* ── Top bar ── */
        .top-bar {
            position:relative; z-index:2; flex-shrink:0;
            display:flex; align-items:center; padding:14px 14px 8px; gap:10px;
        }
        h1 {
            flex:1; text-align:center; font-size:1.4rem; font-weight:900;
            text-shadow:0 0 20px rgba(255,200,80,0.8); letter-spacing:1px;
        }

        /* ── Play area ── */
        .play-area {
            flex:1; position:relative; overflow:hidden;
            touch-action:none; user-select:none; -webkit-user-select:none;
            z-index:1;
        }

        /* ── Hint ── */
        .hint {
            position:absolute; inset:0;
            display:flex; flex-direction:column;
            align-items:center; justify-content:center; gap:16px;
            pointer-events:none;
            transition:opacity 0.6s ease;
        }
        .hint.hidden { opacity:0; }
        .hint-icon { font-size:5rem; animation:bob 1.4s ease-in-out infinite; }
        @keyframes bob {
            0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)}
        }
        .hint-text {
            font-size:1.25rem; font-weight:700; text-align:center; line-height:1.5;
            color:rgba(255,255,255,0.75); text-shadow:0 2px 10px rgba(0,0,0,0.5);
        }

        /* ── Emoji particles ── */
        .ep {
            position:absolute; pointer-events:none;
            font-size:var(--sz); line-height:1;
            transform-origin:center;
            animation:popFade var(--dur) ease-out forwards;
            will-change:transform,opacity;
            filter:drop-shadow(0 2px 8px rgba(0,0,0,0.4));
        }
        @keyframes popFade {
            0%   { transform:translate(-50%,-50%) scale(0)    rotate(var(--rot)); opacity:1; }
            18%  { transform:translate(-50%,-58%) scale(1.35) rotate(var(--rot)); opacity:1; }
            35%  { transform:translate(-50%,-55%) scale(1.0)  rotate(var(--rot)); opacity:1; }
            75%  { transform:translate(-50%,-62%) scale(1.0)  rotate(var(--rot)); opacity:0.85; }
            100% { transform:translate(-50%,-95%) scale(0.75) rotate(var(--rot)); opacity:0; }
        }
    </style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="top-bar">
    <a class="back-btn" href="index.html">← Games</a>
    <h1>🐶 Emoji Fun!</h1>
    <div class="top-spacer"></div>
</div>

<div class="play-area" id="playArea">
    <div class="hint" id="hint">
        <div class="hint-icon">👆</div>
        <div class="hint-text">Drag your finger!<br>✨ Animals will appear! ✨</div>
    </div>
</div>

<script src="shared/kit.js?v=1"></script>
<script>
const ANIMALS = [
    '🐶','🐱','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸',
    '🐰','🦊','🐭','🐹','🐙','🦋','🐢','🐦','🦆','🐧',
    '🐬','🐳','🐘','🦒','🦓','🦈','🦜','🦩','🦚','🐊',
    '🐓','🦔','🦥','🦦','🦝','🐿','🦕','🦖','🐡','🐠'
];

/* Stars */

const area = document.getElementById('playArea');
const hint = document.getElementById('hint');
let hintHidden = false;

function hideHint() {
    if (!hintHidden) { hintHidden = true; hint.classList.add('hidden'); }
}

function spawnEmoji(x, y) {
    const emoji = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
    const sz    = (Math.random() * 1.6 + 2.2).toFixed(1); // 2.2–3.8 rem
    const rot   = (Math.random() * 32 - 16).toFixed(0);   // ±16 deg
    const dur   = (Math.random() * 0.7 + 2.0).toFixed(2); // 2.0–2.7 s
    const ox    = (Math.random() * 22 - 11) | 0;
    const oy    = (Math.random() * 22 - 11) | 0;

    const el = document.createElement('div');
    el.className = 'ep';
    el.textContent = emoji;
    el.style.cssText =
        'left:' + (x + ox) + 'px;' +
        'top:'  + (y + oy) + 'px;' +
        '--sz:' + sz  + 'rem;' +
        '--rot:' + rot + 'deg;' +
        '--dur:' + dur + 's';
    area.appendChild(el);
    setTimeout(() => el.remove(), dur * 1000 + 100);
}

/* Distance helper */
function moved(x, y, last) {
    return !last || Math.hypot(x - last.x, y - last.y) >= 28;
}

/* Touch tracking (supports multi-touch for tiny hands) */
const lastTouch = {};

area.addEventListener('touchstart', e => {
    e.preventDefault();
    hideHint();
    const rect = area.getBoundingClientRect();
    for (const t of e.changedTouches) {
        const x = t.clientX - rect.left;
        const y = t.clientY - rect.top;
        lastTouch[t.identifier] = { x, y };
        spawnEmoji(x, y);
    }
}, { passive:false });

area.addEventListener('touchmove', e => {
    e.preventDefault();
    const rect = area.getBoundingClientRect();
    for (const t of e.changedTouches) {
        const x = t.clientX - rect.left;
        const y = t.clientY - rect.top;
        if (moved(x, y, lastTouch[t.identifier])) {
            lastTouch[t.identifier] = { x, y };
            spawnEmoji(x, y);
        }
    }
}, { passive:false });

area.addEventListener('touchend', e => {
    for (const t of e.changedTouches) delete lastTouch[t.identifier];
}, { passive:false });

/* Mouse (desktop testing) */
let mouseDown = false, lastMouse = null;

area.addEventListener('mousedown', e => {
    mouseDown = true; hideHint();
    const rect = area.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    lastMouse = { x, y }; spawnEmoji(x, y);
});
area.addEventListener('mousemove', e => {
    if (!mouseDown) return;
    const rect = area.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    if (moved(x, y, lastMouse)) { lastMouse = { x, y }; spawnEmoji(x, y); }
});
area.addEventListener('mouseup',    () => { mouseDown = false; lastMouse = null; });
area.addEventListener('mouseleave', () => { mouseDown = false; lastMouse = null; });
</script>
</body>
</html>
