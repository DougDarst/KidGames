<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐻 Hide &amp; Seek!</title>
    <link rel="stylesheet" href="shared/kit.css?v=1">
    <style>
        html, body {
            height:100%; height:100dvh; overflow:hidden;
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
        }
        body { display:flex; flex-direction:column; }

        /* ── Top bar ── */
        .top-bar {
            flex-shrink:0; display:flex; align-items:center; gap:10px;
            padding:12px 14px 10px;
            background:linear-gradient(135deg,#1a0040,#2d0060);
            border-bottom:2px solid rgba(255,255,255,0.12);
        }
        h1 { flex:1; text-align:center; font-size:1.3rem; font-weight:900; color:white;
             text-shadow:0 0 20px rgba(255,200,80,0.8); }
        #counter {
            flex-shrink:0; font-size:1.1rem; font-weight:900; color:#ffd700;
            text-shadow:0 0 10px rgba(255,215,0,0.6); min-width:56px; text-align:right;
        }

        /* ── Scene ── */
        #scene {
            flex:1; position:relative; overflow:hidden;
            background:linear-gradient(to bottom,
                #5fb8e8 0%, #87ceeb 44%,
                #5ab552 44%, #3d9140 75%, #2d7a30 100%);
        }

        /* Sun */
        #sun {
            position:absolute; right:12%; top:7%;
            width:60px; height:60px; border-radius:50%;
            background:radial-gradient(circle, #fffacd, #ffd700);
            box-shadow:0 0 40px #ffd70088, 0 0 70px #ffd70044;
        }

        /* Clouds */
        .cloud {
            position:absolute; background:rgba(255,255,255,0.88);
            border-radius:50px; animation:drift linear infinite;
        }
        .cloud::before, .cloud::after {
            content:''; position:absolute; background:inherit; border-radius:50%;
        }
        @keyframes drift { from{transform:translateX(-180px)} to{transform:translateX(110vw)} }

        /* Decorative ground elements */
        .deco {
            position:absolute; font-size:28px; line-height:1;
            pointer-events:none; user-select:none;
        }

        /* ── Hiding spots ── */
        .spot {
            position:absolute; transform:translate(-50%,-50%);
            display:flex; align-items:center; justify-content:center;
            cursor:pointer; touch-action:manipulation;
            user-select:none; -webkit-user-select:none;
        }
        .spot-emoji {
            font-size:min(22vw,88px); line-height:1;
            display:block;
            filter:drop-shadow(0 4px 8px rgba(0,0,0,0.3));
            transition:transform 0.12s;
        }
        .spot:active .spot-emoji { transform:scale(0.9); }

        /* Shake on wrong tap */
        .spot.shake .spot-emoji { animation:shake 0.45s ease; }
        @keyframes shake {
            0%,100%{transform:translateX(0)}
            20%{transform:translateX(-9px) rotate(-4deg)}
            40%{transform:translateX(9px)  rotate(4deg)}
            60%{transform:translateX(-6px) rotate(-3deg)}
            80%{transform:translateX(6px)  rotate(3deg)}
        }
        /* Happy bounce on found */
        .spot.happy .spot-emoji { animation:happyBounce 0.5s cubic-bezier(0.34,1.6,0.64,1); }
        @keyframes happyBounce {
            0%{transform:scale(1)}
            40%{transform:scale(1.3) rotate(-8deg)}
            70%{transform:scale(1.15) rotate(5deg)}
            100%{transform:scale(1.0) rotate(0)}
        }
        /* Subtle peek hint (correct spot gently wiggles every few seconds) */
        .spot.peek .spot-emoji { animation:peekWiggle 0.6s ease; }
        @keyframes peekWiggle {
            0%,100%{transform:translateX(0)}
            30%{transform:translateX(-5px)}
            70%{transform:translateX(5px)}
        }

        /* ── Bear popup ── */
        #bearEl {
            position:absolute; z-index:80; pointer-events:none;
            font-size:min(42vw,160px); line-height:1;
            transform:translate(-50%,-50%);
            display:none;
        }
        #bearEl.pop { animation:bearPop 0.55s cubic-bezier(0.34,1.8,0.64,1); }
        @keyframes bearPop {
            0%  {transform:translate(-50%,-50%) scale(0) rotate(-20deg)}
            55% {transform:translate(-50%,-50%) scale(1.35) rotate(6deg)}
            80% {transform:translate(-50%,-50%) scale(0.95) rotate(-3deg)}
            100%{transform:translate(-50%,-50%) scale(1) rotate(0)}
        }

        /* ── Wrong animal popup ── */
        #wrongEl {
            position:absolute; z-index:70; pointer-events:none;
            font-size:min(14vw,56px); line-height:1;
            transform:translate(-50%,-50%);
            display:none;
        }
        #wrongEl.pop { animation:wrongPop 0.85s ease forwards; }
        @keyframes wrongPop {
            0%  {transform:translate(-50%,-50%) scale(0); opacity:1}
            35% {transform:translate(-50%,-120%) scale(1.2); opacity:1}
            70% {transform:translate(-50%,-160%) scale(1); opacity:0.7}
            100%{transform:translate(-50%,-200%) scale(0.7); opacity:0}
        }

        /* ── "Found me!" message ── */
        #foundMsg {
            position:fixed; inset:0; z-index:90; pointer-events:none;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            gap:8px;
        }
        #foundWord {
            font-size:min(18vw,76px); font-weight:900; color:#ffd700;
            text-shadow:0 0 30px #ff8c00, 4px 4px 0 rgba(180,60,0,0.5);
            transform:scale(0); transition:transform 0.4s cubic-bezier(0.34,1.8,0.64,1);
            font-family:Impact,'Arial Black',sans-serif;
            letter-spacing:-0.01em;
        }
        #foundWord.show { transform:scale(1); }
        #foundSub {
            font-size:1.3rem; font-weight:800; color:white;
            text-shadow:0 2px 10px rgba(0,0,0,0.7);
            opacity:0; transition:opacity 0.3s 0.3s;
        }
        #foundSub.show { opacity:1; }

        /* ── Hint text ── */
        #hintText {
            position:absolute; bottom:14px; left:0; right:0;
            text-align:center; pointer-events:none; z-index:10;
            font-size:0.95rem; font-weight:700; color:rgba(255,255,255,0.9);
            text-shadow:0 2px 8px rgba(0,0,0,0.6);
            animation:hintPulse 2s ease-in-out infinite;
        }
        @keyframes hintPulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
    </style>
</head>
<body>

<div class="top-bar">
    <a class="back-btn" href="index.html">← Games</a>
    <h1>🐻 Hide &amp; Seek!</h1>
    <div id="counter">🐾 0</div>
</div>

<div id="scene">
    <!-- Sun -->
    <div id="sun"></div>

    <!-- Clouds (built by JS) -->

    <!-- Decorative ground flowers -->
    <div class="deco" style="left:35%;top:53%">🌸</div>
    <div class="deco" style="left:60%;top:56%">🌼</div>
    <div class="deco" style="left:42%;top:79%">🌺</div>
    <div class="deco" style="left:28%;top:82%">🌸</div>
    <div class="deco" style="left:66%;top:84%">🌼</div>
    <div class="deco" style="left:88%;top:78%">🌸</div>
    <div class="deco" style="left:7%;top:55%">🌷</div>

    <!-- Hiding spots -->
    <div class="spot" id="s-tree"     data-id="tree">    <span class="spot-emoji">🌳</span></div>
    <div class="spot" id="s-rock"     data-id="rock">    <span class="spot-emoji">🪨</span></div>
    <div class="spot" id="s-mushroom" data-id="mushroom"><span class="spot-emoji">🍄</span></div>
    <div class="spot" id="s-bush"     data-id="bush">    <span class="spot-emoji">🌿</span></div>
    <div class="spot" id="s-blanket"  data-id="blanket"> <span class="spot-emoji">🛌</span></div>

    <!-- Bear popup -->
    <div id="bearEl">🐻</div>

    <!-- Wrong animal popup -->
    <div id="wrongEl"></div>

    <!-- Hint -->
    <div id="hintText">🐾 Tap something to find the bear!</div>
</div>

<!-- Found overlay -->
<div id="foundMsg">
    <div id="foundWord"></div>
    <div id="foundSub"></div>
</div>

<!-- Confetti layer -->
<div class="confetti-wrap" id="confetti"></div>

<script src="shared/kit.js?v=1"></script>
<script>
/* ── Spot definitions ── */
const SPOTS = [
    { id:'tree',     emoji:'🌳', name:'behind the tree',     x:'19%', y:'40%' },
    { id:'rock',     emoji:'🪨', name:'under the rock',      x:'79%', y:'30%' },
    { id:'mushroom', emoji:'🍄', name:'behind the mushroom', x:'50%', y:'52%' },
    { id:'bush',     emoji:'🌿', name:'in the bushes',       x:'16%', y:'70%' },
    { id:'blanket',  emoji:'🛌', name:'under the blanket',   x:'78%', y:'67%' },
];

const WRONG_ANIMALS = ['🐇','🦋','🐿️','🐦','🦔','🐛','🐝','🐞'];

const CHEERS = [
    'You found me! 🎉','There I was! ⭐','Great job! 🌟',
    'Yay! You found me!','Amazing! 💫','Peek-a-boo! 🙈',
];

/* ── State ── */
let hideSpot  = null;
let found     = 0;
let searching = true;
let lastSpotId = null;
let peekInterval = null;

/* ── Audio ── */
function playGiggle() {
    try {
        const a = Kit.audio();
        // Ascending playful notes — sounds like a happy giggle
        [0, 0.07, 0.14, 0.21, 0.29, 0.37].forEach((delay, i) => {
            const freq = [440, 600, 520, 700, 620, 820][i];
            const o = a.createOscillator(), g = a.createGain();
            o.type = 'sine'; o.frequency.value = freq;
            o.connect(g); g.connect(a.destination);
            g.gain.setValueAtTime(0.26, a.currentTime + delay);
            g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + delay + 0.14);
            o.start(a.currentTime + delay); o.stop(a.currentTime + delay + 0.14);
        });
    } catch(e){}
}

function playBoing() {
    try {
        const a = Kit.audio();
        const o = a.createOscillator(), g = a.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(380, a.currentTime);
        o.frequency.setValueAtTime(540, a.currentTime + 0.04);
        o.frequency.exponentialRampToValueAtTime(200, a.currentTime + 0.3);
        o.connect(g); g.connect(a.destination);
        g.gain.setValueAtTime(0.22, a.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.35);
        o.start(); o.stop(a.currentTime + 0.35);
    } catch(e){}
}

/* ── Build scene ── */

// Position spots
SPOTS.forEach(s => {
    const el = document.getElementById('s-' + s.id);
    el.style.left = s.x;
    el.style.top  = s.y;
});

// Build clouds
const scene = document.getElementById('scene');
[
    { w:110, h:36, top:'6%',  dur:'22s', delay:'0s'   },
    { w:80,  h:28, top:'14%', dur:'30s', delay:'-12s'  },
    { w:130, h:40, top:'9%',  dur:'26s', delay:'-7s'   },
].forEach(c => {
    const el = document.createElement('div');
    el.className = 'cloud';
    el.style.cssText = `width:${c.w}px;height:${c.h}px;top:${c.top};left:-${c.w}px;` +
        `animation-duration:${c.dur};animation-delay:${c.delay};`;
    const bef = el.querySelector?.('::before'); // just apply inline
    el.style.setProperty('--w', c.w + 'px');
    // pseudo-elements via actual child divs
    const b1 = document.createElement('div');
    b1.style.cssText = `width:${c.w*0.55}px;height:${c.h*1.5}px;border-radius:50%;` +
        `background:inherit;position:absolute;top:-${c.h*0.5}px;left:${c.w*0.2}px;`;
    const b2 = document.createElement('div');
    b2.style.cssText = `width:${c.w*0.4}px;height:${c.h*1.3}px;border-radius:50%;` +
        `background:inherit;position:absolute;top:-${c.h*0.3}px;left:${c.w*0.55}px;`;
    el.appendChild(b1); el.appendChild(b2);
    scene.appendChild(el);
});

/* ── Game logic ── */

function pickSpot() {
    const candidates = SPOTS.filter(s => s.id !== lastSpotId);
    const pick = candidates[Math.floor(Math.random() * candidates.length)];
    lastSpotId = pick.id;
    return pick;
}

function startRound() {
    hideSpot  = pickSpot();
    searching = true;
    document.getElementById('hintText').textContent = '🐾 Tap something to find the bear!';

    // Clear bear + found message
    const bearEl = document.getElementById('bearEl');
    bearEl.style.display = 'none';
    bearEl.classList.remove('pop');
    document.getElementById('foundWord').classList.remove('show');
    document.getElementById('foundSub').classList.remove('show');

    // Restart peek interval (subtle hint after 6s of no finding)
    clearInterval(peekInterval);
    peekInterval = setInterval(doPeek, 6000);
}

function doPeek() {
    if (!searching || !hideSpot) return;
    const el = document.getElementById('s-' + hideSpot.id);
    el.classList.remove('peek');
    void el.offsetWidth;
    el.classList.add('peek');
    el.addEventListener('animationend', () => el.classList.remove('peek'), { once: true });
}

function onTap(id) {
    if (!searching) return;

    const spotEl = document.getElementById('s-' + id);

    if (id === hideSpot.id) {
        // ✅ FOUND!
        searching = false;
        clearInterval(peekInterval);
        found++;
        document.getElementById('counter').textContent = '🐾 ' + found;

        // Happy bounce on the spot
        spotEl.classList.remove('shake');
        spotEl.classList.add('happy');

        // Show bear popup near the spot
        const bearEl   = document.getElementById('bearEl');
        const spotRect = spotEl.getBoundingClientRect();
        const sceneRect = scene.getBoundingClientRect();
        bearEl.style.left = (spotRect.left + spotRect.width  / 2 - sceneRect.left) + 'px';
        bearEl.style.top  = (spotRect.top  + spotRect.height / 2 - sceneRect.top  - 30) + 'px';
        bearEl.style.display = 'block';
        bearEl.classList.remove('pop');
        void bearEl.offsetWidth;
        bearEl.classList.add('pop');

        // Found text
        const cheer = CHEERS[Math.floor(Math.random() * CHEERS.length)];
        const subPhrases = ['He was ' + hideSpot.name + '! 🐾', 'Found in ' + found + ' tries!', 'Now find me again!'];
        document.getElementById('foundWord').textContent = cheer;
        document.getElementById('foundSub').textContent  = subPhrases[Math.floor(Math.random() * subPhrases.length)];
        document.getElementById('foundWord').classList.add('show');
        document.getElementById('foundSub').classList.add('show');

        playGiggle();
        Kit.confetti(70);

        // Re-hide after 2.2s
        setTimeout(() => {
            spotEl.classList.remove('happy');
            startRound();
        }, 2200);

    } else {
        // ❌ Wrong spot — shake and show a wrong animal
        spotEl.classList.remove('shake');
        void spotEl.offsetWidth;
        spotEl.classList.add('shake');
        spotEl.addEventListener('animationend', () => spotEl.classList.remove('shake'), { once: true });

        showWrongAnimal(spotEl);
        playBoing();
    }
}

function showWrongAnimal(spotEl) {
    const animal  = WRONG_ANIMALS[Math.floor(Math.random() * WRONG_ANIMALS.length)];
    const wrongEl = document.getElementById('wrongEl');
    const spotRect = spotEl.getBoundingClientRect();
    const sceneRect = scene.getBoundingClientRect();

    wrongEl.textContent = animal;
    wrongEl.style.left  = (spotRect.left + spotRect.width  / 2 - sceneRect.left) + 'px';
    wrongEl.style.top   = (spotRect.top  + spotRect.height / 2 - sceneRect.top) + 'px';
    wrongEl.style.display = 'block';
    wrongEl.classList.remove('pop');
    void wrongEl.offsetWidth;
    wrongEl.classList.add('pop');

    setTimeout(() => {
        wrongEl.style.display = 'none';
        wrongEl.classList.remove('pop');
    }, 900);
}

/* ── Wire up spots ── */
document.querySelectorAll('.spot').forEach(el => {
    const id = el.dataset.id;
    el.addEventListener('touchend', e => {
        e.preventDefault();
        onTap(id);
    }, { passive: false });
    el.addEventListener('click', () => onTap(id));
});

/* ── Boot ── */
startRound();
</script>
</body>
</html>
