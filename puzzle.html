<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🧩 Unicorn Puzzle — Ellie & Grandpa</title>
    <link rel="stylesheet" href="shared/kit.css?v=1">
    <style>
        body {
            min-height:100vh; min-height:100dvh;
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Rounded,sans-serif;
            background:linear-gradient(135deg,#1a0040,#0a1560,#2d0060,#0a1560,#1a0040);
            background-size:400% 400%;
            animation:bgShift 12s ease infinite;
            display:flex; flex-direction:column; align-items:center;
            padding:14px 14px 24px; overflow-x:hidden; color:white;
        }

        .game {
            position:relative; z-index:1; width:100%; max-width:420px;
            display:flex; flex-direction:column; align-items:center; gap:12px;
        }

        /* ── Top bar ── */
        .top-bar { width:100%; display:flex; align-items:center; gap:10px; }
        h1 {
            flex:1; text-align:center; font-size:1.35rem; font-weight:900;
            text-shadow:0 0 20px rgba(255,200,80,0.8); letter-spacing:1px;
        }

        /* ── Stats row ── */
        .stats-row { display:flex; gap:10px; width:100%; align-items:stretch; }
        .stat-card {
            flex:1; background:rgba(255,255,255,0.08);
            backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
            border:2px solid rgba(255,255,255,0.15); border-radius:20px;
            padding:10px 8px; text-align:center;
        }
        .stat-icon  { font-size:1.3rem; }
        .stat-value { font-size:1.9rem; font-weight:900; color:#ffd700;
                      text-shadow:0 0 10px rgba(255,215,0,0.55); line-height:1.1; }
        .stat-label { font-size:0.62rem; color:rgba(255,255,255,0.4);
                      letter-spacing:2px; text-transform:uppercase; }

        /* Goal preview: a tiny 3×3 solved grid */
        .preview-card {
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
            border:2px solid rgba(255,255,255,0.15); border-radius:20px;
            padding:8px; display:flex; flex-direction:column;
            align-items:center; justify-content:center; gap:4px;
        }
        .preview-label { font-size:0.58rem; color:rgba(255,255,255,0.4);
                         letter-spacing:2px; text-transform:uppercase; }
        .preview-grid {
            display:grid; grid-template-columns:repeat(3,1fr);
            grid-template-rows:repeat(3,1fr);
            gap:2px; width:72px; height:72px;
            background:rgba(0,0,0,0.3); border-radius:8px; padding:2px;
            border:1.5px solid rgba(255,255,255,0.2);
        }
        .preview-cell { position:relative; overflow:hidden; border-radius:3px; }
        .preview-cell .pcl {
            position:absolute;
            display:flex; align-items:center; justify-content:center;
            background:linear-gradient(135deg,#f5eeff,#e8f0ff);
            pointer-events:none;
        }
        .preview-cell .pcl span { line-height:1; }

        /* ── Puzzle ── */
        .puzzle-wrap {
            width:100%; aspect-ratio:1;
            background:rgba(0,0,0,0.45);
            border:2px solid rgba(255,255,255,0.08);
            border-radius:18px; padding:5px;
        }
        .puzzle-grid {
            width:100%; height:100%;
            display:grid;
            grid-template-columns:repeat(3,1fr);
            grid-template-rows:repeat(3,1fr);   /* explicit rows prevent iOS height:0 tiles */
            gap:5px;
        }

        .tile {
            position:relative; overflow:hidden;
            border-radius:10px; cursor:pointer;
            border:2px solid rgba(255,255,255,0.3);
            box-shadow:0 3px 12px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.25);
            touch-action:manipulation;
            user-select:none; -webkit-user-select:none;
        }
        /* Inner div sized & positioned in pixels via JS — avoids iOS resolving
           height:% against a 0-height containing block with auto grid rows. */
        .tile .tl {
            position:absolute;
            display:flex; align-items:center; justify-content:center;
            background:linear-gradient(135deg,#f5eeff,#e8f0ff);
            pointer-events:none; user-select:none; -webkit-user-select:none;
        }
        .tile .tl span { line-height:1; }

        .tile.sliding {
            transition:transform 0.17s cubic-bezier(0.4,0,0.2,1);
            z-index:10;
        }

        .tile-empty {
            border-radius:10px; cursor:default;
            background:rgba(255,255,255,0.04);
            border:2px dashed rgba(255,255,255,0.1);
        }

        /* ── Status / buttons ── */
        .status-bar {
            width:100%; background:rgba(255,255,255,0.1);
            border:1.5px solid rgba(255,255,255,0.2); border-radius:50px;
            padding:10px 20px; font-size:0.95rem; font-weight:700; text-align:center;
            min-height:44px; display:flex; align-items:center; justify-content:center;
        }
        .r-emoji { font-size:5rem; display:block; margin-bottom:8px; }
        .r-title { font-size:1.8rem; font-weight:900; color:#ffd700;
                   text-shadow:0 0 20px rgba(255,215,0,0.7); margin-bottom:6px; }
        .r-msg   { font-size:0.9rem; color:rgba(255,255,255,0.7); margin-bottom:24px; line-height:1.5; }
    </style>
</head>
<body>

<div class="stars"         id="stars"></div>
<div class="confetti-wrap" id="confetti"></div>

<div class="overlay" id="overlay">
    <div class="result-card">
        <span class="r-emoji">🦄</span>
        <div class="r-title">You did it!</div>
        <div class="r-msg" id="rMsg">Amazing job!</div>
        <button class="play-again-btn" onclick="newGame()">Play Again! 🧩</button>
    </div>
</div>

<div class="game">
    <div class="top-bar">
        <a class="back-btn" href="index.html">← Games</a>
        <h1>🧩 Unicorn Puzzle</h1>
        <div class="top-spacer"></div>
    </div>

    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-icon">🎯</div>
            <div class="stat-value" id="movesVal">0</div>
            <div class="stat-label">moves</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">🏆</div>
            <div class="stat-value" id="bestVal">—</div>
            <div class="stat-label">best</div>
        </div>
        <div class="preview-card">
            <div class="preview-label">Goal</div>
            <div class="preview-grid" id="previewGrid"></div>
        </div>
    </div>

    <div class="puzzle-wrap">
        <div class="puzzle-grid" id="puzzleGrid"></div>
    </div>

    <div class="status-bar">Slide tiles to complete the 🦄!</div>

    <button class="new-game-btn" onclick="newGame()">🔄 New Puzzle</button>
</div>

<script src="shared/kit.js?v=1"></script>
<script>
/* ── Game state ── */
// grid[0..8]: values 1–8 = tiles, 0 = blank. Solved = [1,2,3,4,5,6,7,8,0]
let grid     = [];
let blankIdx = 0;
let moves    = 0;
let locked   = false;
let bestMoves = localStorage.getItem('unicornPuzzleBest')
    ? parseInt(localStorage.getItem('unicornPuzzleBest'), 10)
    : null;

/* ── Tile pixel size cache ──
   All inner-div positioning uses pixel values (not %) to avoid iOS resolving
   height:% against a 0-height containing block when grid rows are auto. */
let gTilePx = 0;

const puzzleGrid = document.getElementById('puzzleGrid');

function measureTile() {
    const w = puzzleGrid.getBoundingClientRect().width;
    if (w > 10) gTilePx = Math.round((w - 10) / 3); // subtract 2 gaps × 5px
    return gTilePx;
}

/* ── Puzzle helpers ── */
function neighbors(idx) {
    const r = Math.floor(idx / 3), c = idx % 3, n = [];
    if (r > 0) n.push(idx - 3);
    if (r < 2) n.push(idx + 3);
    if (c > 0) n.push(idx - 1);
    if (c < 2) n.push(idx + 1);
    return n;
}

function isSolved() {
    return grid[8] === 0 && grid.slice(0, 8).every((v, i) => v === i + 1);
}

/* ── Shuffle by walking from solved state — always solvable ── */
function generateShuffle() {
    grid     = [1, 2, 3, 4, 5, 6, 7, 8, 0];
    blankIdx = 8;
    let prev = -1;
    for (let i = 0; i < 300; i++) {
        const opts = neighbors(blankIdx).filter(n => n !== prev);
        const pick = opts[Math.floor(Math.random() * opts.length)];
        prev = blankIdx;
        [grid[blankIdx], grid[pick]] = [grid[pick], grid[blankIdx]];
        blankIdx = pick;
    }
}

/* ── Build inner clip div for one tile ──
   natRow/natCol: where this tile sits in the solved 3×3 image.
   The inner div is 3× the tile size, shifted so only the correct
   third is visible through the tile's overflow:hidden. */
function makeTileInner(tileNum) {
    const natRow = Math.floor((tileNum - 1) / 3);
    const natCol = (tileNum - 1) % 3;
    const tp = gTilePx || 80;          // fallback if layout not measured yet
    const sz = tp * 3;                  // inner div spans 3 tiles
    const ep = Math.round(sz * 0.82);  // emoji fills ~82% of assembled width

    const inner = document.createElement('div');
    inner.className   = 'tl';
    inner.dataset.r   = natRow;
    inner.dataset.c   = natCol;
    inner.style.width  = sz + 'px';
    inner.style.height = sz + 'px';
    inner.style.top    = (-natRow * tp) + 'px';
    inner.style.left   = (-natCol * tp) + 'px';

    const span = document.createElement('span');
    span.textContent      = '🦄';
    span.style.fontSize   = ep + 'px';
    span.style.lineHeight = '1';
    inner.appendChild(span);
    return inner;
}

/* ── Render grid ── */
function render() {
    puzzleGrid.innerHTML = '';
    measureTile(); // refresh pixel cache
    grid.forEach((tileNum, pos) => {
        const cell = document.createElement('div');
        if (tileNum === 0) {
            cell.className = 'tile-empty';
        } else {
            cell.className = 'tile';
            cell.appendChild(makeTileInner(tileNum));
            cell.addEventListener('click', () => onTap(pos));
        }
        puzzleGrid.appendChild(cell);
    });
}

/* ── Recompute pixel sizes on existing tiles (orientation / window resize) ── */
function resizeEmoji() {
    measureTile();
    if (!gTilePx) return;
    const tp = gTilePx;
    const sz = tp * 3;
    const ep = Math.round(sz * 0.82);
    puzzleGrid.querySelectorAll('.tile .tl').forEach(tl => {
        tl.style.width  = sz + 'px';
        tl.style.height = sz + 'px';
        tl.style.top    = (-tl.dataset.r * tp) + 'px';
        tl.style.left   = (-tl.dataset.c * tp) + 'px';
        tl.querySelector('span').style.fontSize = ep + 'px';
    });
    buildPreview();
}

/* ── Handle tile tap — pixel-perfect slide animation ── */
function onTap(pos) {
    if (locked) return;
    if (pos === blankIdx) return;
    if (!neighbors(blankIdx).includes(pos)) return;

    locked = true;

    const tileEl  = puzzleGrid.children[pos];
    const emptyEl = puzzleGrid.children[blankIdx];
    const tileR   = tileEl.getBoundingClientRect();
    const emptyR  = emptyEl.getBoundingClientRect();
    const dx = emptyR.left - tileR.left;
    const dy = emptyR.top  - tileR.top;

    tileEl.classList.add('sliding');
    tileEl.style.transform = `translate(${dx}px,${dy}px)`;

    setTimeout(() => {
        [grid[blankIdx], grid[pos]] = [grid[pos], grid[blankIdx]];
        blankIdx = pos;
        moves++;
        document.getElementById('movesVal').textContent = moves;
        render();
        locked = false;
        if (isSolved()) setTimeout(showWin, 250);
    }, 185);
}

/* ── Win ── */
function showWin() {
    const isNewBest = bestMoves === null || moves < bestMoves;
    if (isNewBest) {
        bestMoves = moves;
        localStorage.setItem('unicornPuzzleBest', bestMoves);
        document.getElementById('bestVal').textContent = bestMoves;
    }
    document.getElementById('rMsg').textContent =
        `You solved it in ${moves} move${moves === 1 ? '' : 's'}!` +
        (isNewBest ? ' New best! 🌟' : ` (Best: ${bestMoves})`);
    document.getElementById('overlay').classList.add('show');
    Kit.confetti();
}

/* ── New game ── */
function newGame() {
    moves  = 0;
    locked = false;
    document.getElementById('movesVal').textContent = 0;
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('confetti').innerHTML   = '';
    generateShuffle();
    render();
    document.getElementById('bestVal').textContent = bestMoves !== null ? bestMoves : '—';
}

/* ── Goal preview: tiny 3×3 solved version using same clip approach ── */
function buildPreview() {
    const pg = document.getElementById('previewGrid');
    pg.innerHTML = '';
    // #previewGrid has CSS width:72px height:72px; each cell ≈ (72-8)/3 ≈ 21px
    const cellPx = Math.round((pg.getBoundingClientRect().width - 8) / 3) || 20;
    const sz     = cellPx * 3;
    const ep     = Math.round(sz * 0.82);

    for (let t = 1; t <= 8; t++) {
        const cell   = document.createElement('div');
        cell.className = 'preview-cell';
        const natRow = Math.floor((t - 1) / 3);
        const natCol = (t - 1) % 3;
        const inner  = document.createElement('div');
        inner.className    = 'pcl';
        inner.style.width  = sz + 'px';
        inner.style.height = sz + 'px';
        inner.style.top    = (-natRow * cellPx) + 'px';
        inner.style.left   = (-natCol * cellPx) + 'px';
        const span = document.createElement('span');
        span.textContent      = '🦄';
        span.style.fontSize   = ep + 'px';
        span.style.lineHeight = '1';
        inner.appendChild(span);
        cell.appendChild(inner);
        pg.appendChild(cell);
    }
    // blank cell (bottom-right in solved state)
    const blank = document.createElement('div');
    blank.className       = 'preview-cell';
    blank.style.background = 'rgba(255,255,255,0.06)';
    pg.appendChild(blank);
}

/* ── Handle orientation / window resize ── */
new ResizeObserver(resizeEmoji).observe(puzzleGrid);

/* ── Boot ──
   newGame() renders immediately (gTilePx may be 0 before layout → fallback 80px).
   The RAF fires after the browser has done layout, so measureTile() gets the
   real grid width and resizeEmoji() corrects all tile sizes. */
newGame();
requestAnimationFrame(() => {
    resizeEmoji();
    buildPreview();
});
</script>
</body>
</html>
