<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎵 Music Bars — Ellie & Grandpa</title>
    <link rel="stylesheet" href="shared/kit.css?v=1">
    <style>
        body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Rounded, sans-serif;
            background: linear-gradient(135deg, #1a0040, #0a1560, #2d0060, #0a1560, #1a0040);
            background-size: 400% 400%;
            animation: bgShift 12s ease infinite;
            overflow: hidden;
            color: white;
        }

        /* ── Portrait: rotate prompt ── */
        .rotate-prompt {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            text-align: center;
            padding: 40px;
        }
        .rotate-icon {
            font-size: 5rem;
            animation: tiltPhone 2.4s ease-in-out infinite;
        }
        @keyframes tiltPhone {
            0%, 100% { transform: rotate(0deg);  }
            35%, 65%  { transform: rotate(90deg); }
        }
        .rotate-title {
            font-size: 1.5rem;
            font-weight: 900;
            text-shadow: 0 0 20px rgba(255,200,80,0.7);
            line-height: 1.4;
        }
        .rotate-sub {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.5);
            font-weight: 500;
        }

        /* ── Landscape: game ── */
        .game {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        /* ── Top bar ── */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px 4px;
            flex-shrink: 0;
        }
        .top-title {
            flex: 1;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 900;
            text-shadow: 0 0 20px rgba(255,200,80,0.8);
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* ── Bars area ── */
        .bars-area {
            flex: 1;
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 10px;
            padding: 8px 14px 16px;
            min-height: 0;
        }

        /* ── Individual bar ── */
        .bar {
            flex: 1;
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px 6px 12px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            position: relative;
            overflow: hidden;
            /* 3-D gloss effect */
            box-shadow:
                inset 0 5px 18px rgba(255,255,255,0.30),
                inset 0 -5px 14px rgba(0,0,0,0.22),
                0 10px 32px rgba(0,0,0,0.50);
            transition: transform 0.07s ease, filter 0.07s ease;
        }

        /* Pressed state */
        .bar:active {
            transform: scaleY(0.95) scaleX(0.97);
            filter: brightness(1.5) saturate(1.15);
        }

        /* Flash animation on play */
        .bar.flash { animation: barFlash 0.5s ease-out forwards; }
        @keyframes barFlash {
            0%   { filter: brightness(2.0) saturate(1.4); }
            100% { filter: brightness(1.0) saturate(1.0); }
        }

        /* Ripple */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.38);
            transform: scale(0);
            animation: rippleOut 0.55s linear forwards;
            pointer-events: none;
        }
        @keyframes rippleOut {
            to { transform: scale(4); opacity: 0; }
        }

        /* Bar content */
        .note-label {
            font-size: 1.1rem;
            font-weight: 900;
            color: rgba(255,255,255,0.92);
            text-shadow: 0 2px 8px rgba(0,0,0,0.45);
            letter-spacing: 1px;
        }
        .solfege-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: rgba(255,255,255,0.65);
            letter-spacing: 1px;
            margin-top: -4px;
        }
        .bar-animal {
            font-size: clamp(2rem, 6vh, 3.2rem);
            line-height: 1;
            filter: drop-shadow(0 3px 8px rgba(0,0,0,0.4));
            transition: transform 0.1s;
        }
        .bar-animal.bounce {
            animation: animalBounce 0.42s cubic-bezier(0.34, 1.7, 0.64, 1);
        }
        @keyframes animalBounce {
            0%   { transform: scale(1);   }
            45%  { transform: scale(1.45);}
            100% { transform: scale(1);   }
        }
        .animal-name {
            font-size: clamp(0.55rem, 1.4vh, 0.7rem);
            font-weight: 700;
            color: rgba(255,255,255,0.72);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            text-align: center;
        }

        /* ── Orientation switching ── */
        @media (orientation: portrait) {
            .rotate-prompt { display: flex; }
            .game          { display: none;  }
        }
        @media (orientation: landscape) {
            .rotate-prompt { display: none;  }
            .game          { display: flex;  }
        }
    </style>
</head>
<body>

<div class="stars" id="stars"></div>

<!-- Portrait: rotate prompt -->
<div class="rotate-prompt">
    <div class="rotate-icon">📱</div>
    <div class="rotate-title">Turn your phone sideways<br>to play Music Bars! 🎵</div>
    <div class="rotate-sub">Needs landscape mode</div>
</div>

<!-- Landscape: game -->
<div class="game">
    <div class="top-bar">
        <a class="back-btn" href="index.html">← Games</a>
        <div class="top-title">🎵 Music Bars</div>
        <div class="top-spacer"></div>
    </div>
    <div class="bars-area" id="barsArea"></div>
</div>

<script src="shared/kit.js?v=1"></script>
<script>
    /* ── Note data ── */
    //  color is the bar background; each animal was chosen to match the color
    const NOTES = [
        { note:'C', solfege:'Do',  freq:261.63, color:'#FF2D55', animal:'🐞', animalName:'Ladybug' },
        { note:'D', solfege:'Re',  freq:293.66, color:'#FF9500', animal:'🦊', animalName:'Fox'     },
        { note:'E', solfege:'Mi',  freq:329.63, color:'#FFCC00', animal:'🐣', animalName:'Chick'   },
        { note:'F', solfege:'Fa',  freq:349.23, color:'#34C759', animal:'🐸', animalName:'Frog'    },
        { note:'G', solfege:'Sol', freq:392.00, color:'#007AFF', animal:'🐬', animalName:'Dolphin' },
    ];

    /* ── Web Audio ── */
    function playNote(freq) {
        const ctx = Kit.audio();
        const now = ctx.currentTime;

        // layer 3 sine partials for a warm, bell-like xylophone tone
        function voice(f, amp, decay) {
            const osc = ctx.createOscillator();
            const env = ctx.createGain();
            osc.connect(env);
            env.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.value = f;
            env.gain.setValueAtTime(amp, now);
            env.gain.exponentialRampToValueAtTime(0.0001, now + decay);
            osc.start(now);
            osc.stop(now + decay + 0.05);
        }

        voice(freq,         0.55, 1.6);  // fundamental
        voice(freq * 2.756, 0.20, 0.9);  // xylophone characteristic overtone
        voice(freq * 5.404, 0.06, 0.45); // upper partial (crispness)
    }

    /* ── Build bars ── */
    const barsArea = document.getElementById('barsArea');

    NOTES.forEach(({ note, solfege, freq, color, animal, animalName }) => {
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.backgroundColor = color;
        bar.innerHTML = `
            <div>
                <div class="note-label">${note}</div>
                <div class="solfege-label">${solfege}</div>
            </div>
            <div class="bar-animal">${animal}</div>
            <div class="animal-name">${animalName}</div>
        `;

        bar.addEventListener('pointerdown', e => {
            playNote(freq);

            /* ripple at tap position */
            const rect = bar.getBoundingClientRect();
            const rip  = document.createElement('div');
            rip.className = 'ripple';
            const size = Math.max(rect.width, rect.height) * 2.2;
            rip.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - rect.left - size/2}px;top:${e.clientY - rect.top - size/2}px`;
            bar.appendChild(rip);
            rip.addEventListener('animationend', () => rip.remove(), { once: true });

            /* animal bounce */
            const animalEl = bar.querySelector('.bar-animal');
            animalEl.classList.remove('bounce');
            void animalEl.offsetWidth;           // force reflow to restart animation
            animalEl.classList.add('bounce');

            /* bar flash */
            bar.classList.remove('flash');
            void bar.offsetWidth;
            bar.classList.add('flash');
        });

        barsArea.appendChild(bar);
    });
</script>
</body>
</html>
