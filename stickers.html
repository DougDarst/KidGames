<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎨 Sticker Scene — Ellie &amp; Grandpa</title>
    <link rel="stylesheet" href="shared/kit.css?v=1">
    <style>
        html, body { height:100%; height:100dvh; overflow:hidden;
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }

        body { display:flex; flex-direction:column; background:#1a0040; color:white; }

        /* ── Top bar ── */
        .top-bar {
            flex-shrink:0; display:flex; align-items:center; gap:10px;
            padding:14px 14px 8px; background:rgba(0,0,0,0.25);
            backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
            border-bottom:1px solid rgba(255,255,255,0.1); z-index:10;
        }
        h1 { flex:1; text-align:center; font-size:1.3rem; font-weight:900;
             text-shadow:0 0 20px rgba(255,200,80,0.8); }

        /* ── Scene ── */
        #scene {
            flex:1; position:relative; overflow:hidden;
            transition:background 0.5s ease;
            touch-action:none; user-select:none; -webkit-user-select:none;
        }

        /* Scene backgrounds */
        .bg-beach  { background:linear-gradient(to bottom, #87ceeb 0%, #b8e4f9 50%, #1a8fd1 50%, #0c70a8 63%, #f5deb3 63%, #c9a030 100%); }
        .bg-space  { background:radial-gradient(ellipse at 35% 40%, #0d1a70 0%, #050a32 55%, #000512 100%); }
        .bg-meadow { background:linear-gradient(to bottom, #87ceeb 0%, #d4efff 54%, #4caf50 54%, #2e7d32 100%); }
        .bg-forest { background:linear-gradient(to bottom, #060018 0%, #0c0035 38%, #0a200a 62%, #021002 100%); }

        /* Decor elements (non-interactive background emoji) */
        .decor-el {
            position:absolute; line-height:1; pointer-events:none;
            user-select:none; -webkit-user-select:none;
            transform:translate(-50%,-50%);
        }

        /* Placed stickers */
        .placed-sticker {
            position:absolute; line-height:1; font-size:52px;
            transform:translate(-50%,-50%);
            touch-action:none; user-select:none; -webkit-user-select:none;
            cursor:grab; z-index:5;
            animation:stickerPop 0.38s cubic-bezier(0.34,1.6,0.64,1);
        }
        @keyframes stickerPop {
            0%  { transform:translate(-50%,-50%) scale(0.2); }
            65% { transform:translate(-50%,-50%) scale(1.3); }
            100%{ transform:translate(-50%,-50%) scale(1); }
        }

        /* ── Scene picker ── */
        #scenePicker {
            flex-shrink:0; display:flex; align-items:center; gap:6px;
            padding:7px 12px; background:rgba(0,0,0,0.3);
            backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
            border-top:1px solid rgba(255,255,255,0.08);
            border-bottom:1px solid rgba(255,255,255,0.08);
            overflow-x:auto; -webkit-overflow-scrolling:touch;
        }
        #scenePicker::-webkit-scrollbar { display:none; }
        .scene-btn {
            flex-shrink:0; background:rgba(255,255,255,0.1);
            border:1.5px solid rgba(255,255,255,0.18);
            color:rgba(255,255,255,0.75); border-radius:50px;
            padding:5px 12px; font-size:0.78rem; font-weight:700;
            cursor:pointer; touch-action:manipulation; white-space:nowrap;
            transition:background 0.18s, color 0.18s;
        }
        .scene-btn.active {
            background:rgba(255,215,0,0.22); border-color:rgba(255,215,0,0.55);
            color:#ffd700;
        }
        .clear-btn {
            flex-shrink:0; margin-left:auto;
            background:rgba(255,80,80,0.15); border:1.5px solid rgba(255,80,80,0.3);
            color:rgba(255,160,160,0.9); border-radius:50px;
            padding:5px 12px; font-size:0.78rem; font-weight:700;
            cursor:pointer; touch-action:manipulation;
        }
        .clear-btn:active { background:rgba(255,80,80,0.3); }

        /* ── Sticker palette ── */
        #palette {
            flex-shrink:0; height:86px;
            background:rgba(0,0,0,0.35);
            backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
            border-top:1.5px solid rgba(255,255,255,0.12);
            overflow-x:auto; -webkit-overflow-scrolling:touch;
            display:flex; align-items:center; padding:0 10px; gap:6px;
        }
        #palette::-webkit-scrollbar { display:none; }
        .sticker-btn {
            flex-shrink:0; width:58px; height:62px;
            display:flex; align-items:center; justify-content:center;
            font-size:38px; line-height:1;
            background:rgba(255,255,255,0.07);
            border:1.5px solid rgba(255,255,255,0.12); border-radius:14px;
            cursor:pointer; touch-action:none;
            user-select:none; -webkit-user-select:none;
            transition:transform 0.1s, background 0.1s;
        }
        .sticker-btn:active { transform:scale(0.88); background:rgba(255,255,255,0.18); }

        /* ── Floating drag sticker ── */
        #floatEl {
            position:fixed; z-index:999; pointer-events:none;
            font-size:58px; line-height:1;
            transform:translate(-50%,-50%) scale(1.15);
            display:none;
            filter:drop-shadow(0 6px 16px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body>

<div class="top-bar">
    <a class="back-btn" href="index.html">← Games</a>
    <h1>🎨 Sticker Scene!</h1>
    <div class="top-spacer"></div>
</div>

<div id="scene" class="bg-beach">
    <div id="decor"></div>
</div>

<div id="scenePicker">
    <button class="scene-btn active" data-scene="beach"  onclick="setScene('beach')">🌊 Beach</button>
    <button class="scene-btn"        data-scene="space"  onclick="setScene('space')">🚀 Space</button>
    <button class="scene-btn"        data-scene="meadow" onclick="setScene('meadow')">🌿 Meadow</button>
    <button class="scene-btn"        data-scene="forest" onclick="setScene('forest')">🌲 Forest</button>
    <button class="clear-btn" onclick="clearStickers()">🗑️ Clear</button>
</div>

<div id="palette"></div>

<div id="floatEl"></div>

<script src="shared/kit.js?v=1"></script>
<script>
/* ── Scene definitions ── */
const SCENES = {
    beach: {
        bg: 'bg-beach',
        decor: [
            { e:'☀️', x:82, y:9,  s:58 },
            { e:'⛅', x:16, y:14, s:38 },
            { e:'🌴', x:5,  y:40, s:70 },
            { e:'🐚', x:14, y:70, s:26 },
            { e:'🐚', x:77, y:74, s:22 },
            { e:'🦀', x:55, y:72, s:28 },
        ]
    },
    space: {
        bg: 'bg-space',
        decor: [
            { e:'🌕', x:76, y:8,  s:54 },
            { e:'🪐', x:12, y:60, s:62 },
            { e:'🌍', x:64, y:70, s:44 },
            { e:'⭐', x:32, y:18, s:20 },
            { e:'⭐', x:55, y:10, s:14 },
            { e:'⭐', x:86, y:44, s:16 },
            { e:'⭐', x:42, y:32, s:12 },
            { e:'✨', x:20, y:35, s:24 },
        ]
    },
    meadow: {
        bg: 'bg-meadow',
        decor: [
            { e:'☀️',  x:80, y:8,  s:54 },
            { e:'⛅',  x:25, y:13, s:38 },
            { e:'🌸',  x:7,  y:59, s:32 },
            { e:'🌼',  x:32, y:63, s:30 },
            { e:'🌸',  x:66, y:61, s:28 },
            { e:'🌼',  x:88, y:66, s:24 },
            { e:'🦋',  x:50, y:48, s:30 },
        ]
    },
    forest: {
        bg: 'bg-forest',
        decor: [
            { e:'🌙', x:80, y:9,  s:46 },
            { e:'⭐', x:20, y:13, s:18 },
            { e:'⭐', x:46, y:8,  s:14 },
            { e:'⭐', x:64, y:16, s:16 },
            { e:'⭐', x:35, y:22, s:12 },
            { e:'🌲', x:5,  y:38, s:72 },
            { e:'🌲', x:82, y:42, s:64 },
            { e:'🍄', x:42, y:74, s:30 },
            { e:'🌲', x:50, y:50, s:50 },
        ]
    }
};

/* ── Stickers ── */
const STICKERS = [
    '🦁','🐯','🐻','🦊','🐼','🐸','🦋','🐢','🦜','🦒',
    '🐘','🦓','🐬','🐳','🦕','🦄','🐙','🐠','🐡','🦀',
    '🐧','🦔','🐝','🦩','🦚','🦋','🐉','🦈','🐊','🐿',
    '🌺','🌻','🌹','🌈','☀️','🌙','⭐','🌟','❄️','🔥',
    '🌴','🌵','🍄','⛅','🌸','🌊','🪸','🌿','🍀','🌷',
    '🚀','✈️','🚂','🛸','🎈','🎉','🏰','⛵','🚁','👑',
    '🎀','💎','🏆','🎠','🌈','🎪','🧚','🧜','🧙','🦸',
    '🍦','🎂','🍩','🍕','🍓','🍌','🍉','🧁','🍭','🍎',
];

/* ── State ── */
let currentScene = 'beach';
let dragEmoji    = null;
let dragFromEl   = null;

const sceneEl  = document.getElementById('scene');
const decorEl  = document.getElementById('decor');
const floatEl  = document.getElementById('floatEl');
const paletteEl = document.getElementById('palette');

/* ── Build palette ── */
STICKERS.forEach(emoji => {
    const btn = document.createElement('div');
    btn.className   = 'sticker-btn';
    btn.textContent = emoji;

    btn.addEventListener('touchstart', e => {
        e.preventDefault();
        beginDrag(emoji, e.touches[0].clientX, e.touches[0].clientY, null);
    }, { passive: false });

    btn.addEventListener('mousedown', e => {
        beginDrag(emoji, e.clientX, e.clientY, null);
    });

    paletteEl.appendChild(btn);
});

/* ── Render scene ── */
function setScene(name) {
    currentScene = name;
    const s = SCENES[name];

    // Swap background class
    sceneEl.className = s.bg;

    // Render decorations
    decorEl.innerHTML = '';
    s.decor.forEach(d => {
        const el = document.createElement('div');
        el.className = 'decor-el';
        el.textContent = d.e;
        el.style.left     = d.x + '%';
        el.style.top      = d.y + '%';
        el.style.fontSize = d.s + 'px';
        decorEl.appendChild(el);
    });

    // Clear placed stickers
    sceneEl.querySelectorAll('.placed-sticker').forEach(el => el.remove());

    // Update picker buttons
    document.querySelectorAll('.scene-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.scene === name);
    });
}

function clearStickers() {
    sceneEl.querySelectorAll('.placed-sticker').forEach(el => el.remove());
}

/* ── Place sticker ── */
function placeSticker(emoji, x, y) {
    const el = document.createElement('div');
    el.className   = 'placed-sticker';
    el.textContent = emoji;
    el.style.left  = x + 'px';
    el.style.top   = y + 'px';

    el.addEventListener('touchstart', e => {
        e.preventDefault();
        e.stopPropagation();
        beginDrag(emoji, e.touches[0].clientX, e.touches[0].clientY, el);
    }, { passive: false });

    el.addEventListener('mousedown', e => {
        e.stopPropagation();
        beginDrag(emoji, e.clientX, e.clientY, el);
    });

    sceneEl.appendChild(el);
}

/* ── Drag lifecycle ── */
function beginDrag(emoji, cx, cy, fromEl) {
    dragEmoji  = emoji;
    dragFromEl = fromEl;
    if (fromEl) fromEl.style.opacity = '0';

    floatEl.textContent = emoji;
    floatEl.style.display = 'block';
    moveFloat(cx, cy);

    document.addEventListener('touchmove', onDragMove, { passive: false });
    document.addEventListener('touchend',  onDragEnd,  { passive: false });
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup',   onMouseUp);
}

function moveFloat(cx, cy) {
    floatEl.style.left = cx + 'px';
    floatEl.style.top  = cy + 'px';
}

function onDragMove(e) {
    e.preventDefault();
    moveFloat(e.touches[0].clientX, e.touches[0].clientY);
}

function onMouseMove(e) { moveFloat(e.clientX, e.clientY); }

function commitDrop(cx, cy) {
    const rect = sceneEl.getBoundingClientRect();
    const overScene = cx >= rect.left && cx <= rect.right
                   && cy >= rect.top  && cy <= rect.bottom;

    if (overScene) {
        if (dragFromEl) dragFromEl.remove();
        placeSticker(dragEmoji, cx - rect.left, cy - rect.top);
    } else {
        // Dropped outside (back on palette or elsewhere) — restore or discard
        if (dragFromEl) dragFromEl.style.opacity = '';
    }

    floatEl.style.display = 'none';
    dragEmoji = dragFromEl = null;
    document.removeEventListener('touchmove', onDragMove);
    document.removeEventListener('touchend',  onDragEnd);
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup',   onMouseUp);
}

function onDragEnd(e)  { commitDrop(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }
function onMouseUp(e)  { commitDrop(e.clientX, e.clientY); }

/* ── Boot ── */
setScene('beach');
</script>
</body>
</html>
