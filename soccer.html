<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ Tap to Shoot!</title>
    <link rel="stylesheet" href="shared/kit.css?v=1">
    <style>
        html, body { height:100%; height:100dvh; overflow:hidden; background:#0d3b1a; }

        #canvas { position:fixed; inset:0; width:100%; height:100%; touch-action:none; display:block; }

        #hud {
            position:fixed; top:0; left:0; right:0; z-index:20;
            display:flex; align-items:center; padding:12px 14px;
            pointer-events:none;
        }
        .back-btn {
            pointer-events:auto;
            background:rgba(0,0,0,0.5); border:1.5px solid rgba(255,255,255,0.3);
            color:white; border-radius:50px; padding:8px 14px; font-size:0.82rem;
            font-weight:700; text-decoration:none; white-space:nowrap;
            font-family:-apple-system,BlinkMacSystemFont,sans-serif;
        }
        .back-btn:active { background:rgba(0,0,0,0.75); }
        #scoreBadge {
            margin-left:auto;
            background:rgba(0,0,0,0.55); border:2px solid rgba(255,215,0,0.6);
            border-radius:50px; padding:8px 18px; color:white;
            font-family:Impact,'Arial Black',sans-serif;
            font-size:1.3rem; letter-spacing:0.04em;
        }
        #scoreBadge span { color:#ffd700; }

        /* GOAL! overlay */
        #goalOverlay {
            position:fixed; inset:0; z-index:50; pointer-events:none;
            display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
        }
        #goalWord {
            font-family:Impact,'Arial Black',sans-serif;
            font-size:min(30vw,136px); color:#ffd700; letter-spacing:-0.01em;
            text-shadow:0 0 30px #ff8c00, 0 0 60px #ff4400, 5px 5px 0 #a00;
            transform:scale(0) rotate(-6deg);
            transition:transform 0.4s cubic-bezier(0.34,1.8,0.64,1);
        }
        #goalWord.show { transform:scale(1) rotate(-3deg); }
        #goalSub {
            font-family:-apple-system,BlinkMacSystemFont,sans-serif;
            font-size:1.5rem; font-weight:900; color:white;
            text-shadow:0 2px 12px rgba(0,0,0,0.9);
            opacity:0; transition:opacity 0.3s 0.3s;
        }
        #goalSub.show { opacity:1; }

        /* Save text */
        #saveWord {
            position:fixed; inset:0; z-index:50; pointer-events:none;
            display:flex; align-items:center; justify-content:center;
            font-family:-apple-system,BlinkMacSystemFont,sans-serif;
            font-size:min(14vw,60px); font-weight:900; color:white;
            text-shadow:0 0 20px rgba(0,0,0,0.9), 0 3px 0 rgba(0,0,0,0.5);
            transform:scale(0);
            transition:transform 0.3s cubic-bezier(0.34,1.6,0.64,1);
        }
        #saveWord.show { transform:scale(1); }

        /* Flash */
        #flash {
            position:fixed; inset:0; z-index:45; pointer-events:none;
            background:#ffd700; opacity:0; transition:opacity 0.1s;
        }
        #flash.on { opacity:0.5; }

        /* Tap hint */
        #tapHint {
            position:fixed; bottom:52px; left:0; right:0;
            text-align:center; pointer-events:none; z-index:15;
            font-family:-apple-system,BlinkMacSystemFont,sans-serif;
            font-size:1.05rem; font-weight:700; color:rgba(255,255,255,0.8);
            text-shadow:0 2px 8px rgba(0,0,0,0.7);
            animation:pulse 1.6s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100%{opacity:0.55} 50%{opacity:1} }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="hud">
    <a class="back-btn" href="index.html">← Games</a>
    <div id="scoreBadge">⚽ <span id="scoreNum">0</span></div>
</div>

<div id="goalOverlay">
    <div id="goalWord">GOAL!</div>
    <div id="goalSub"></div>
</div>
<div id="saveWord"></div>
<div id="flash"></div>
<div class="confetti-wrap" id="confetti"></div>
<div id="tapHint">TAP anywhere to shoot! ⚽</div>

<script src="shared/kit.js?v=1"></script>
<script>
/* ══════════════════════════════════════════
   ALL variable declarations first — avoids
   temporal dead zone bugs.
══════════════════════════════════════════ */
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

// Dimensions (set in init)
let dpr = 1, W = 0, H = 0;
let GL, GR, GT, GB, GW, GH;  // goal bounds
let CROWD_H, BALL_SY;         // layout landmarks

// Crowd (pre-generated decorative people)
let crowd = [];

// Game-state enum
const S = { READY:'ready', FLYING:'flying', SCORED:'scored', SAVED:'saved', RESET:'reset' };
let state = S.READY;
let score = 0;
let outcome = null;   // 'goal' | 'save'
let stateTimer = 0;

// Goalie
let gx = 0, gvx = 2.5, gdest = null;

// Ball
let bx = 0, by = 0;          // current position
let bsx = 0, bsy = 0;        // shot start position
let btx = 0, bty = 0;        // shot target
let bp  = 0, brot = 0;       // flight progress, spin

// Effects
let particles  = [];
let netRipple  = null;

/* ══════════════════════════════════════════
   INIT — call after all declarations
══════════════════════════════════════════ */
function init() {
    dpr = window.devicePixelRatio || 1;
    W   = window.innerWidth;
    H   = window.innerHeight;

    canvas.width        = Math.round(W * dpr);
    canvas.height       = Math.round(H * dpr);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    CROWD_H = Math.round(H * 0.08);
    GT      = CROWD_H + 4;
    GH      = Math.round(H * 0.22);
    GB      = GT + GH;
    GL      = Math.round(W * 0.08);
    GR      = Math.round(W * 0.92);
    GW      = GR - GL;
    BALL_SY = Math.round(H * 0.80);

    // Place goalie and ball
    gx = W / 2;
    bx = W / 2;
    by = BALL_SY;

    buildCrowd();
}

function buildCrowd() {
    crowd = [];
    const cols   = Math.floor(W / 17);
    const colors = ['#ef4444','#3b82f6','#22c55e','#f59e0b','#a855f7','#ec4899','#fff','#ff6600','#38bdf8'];
    for (let row = 0; row < 4; row++) {
        for (let col = 0; col < cols; col++) {
            crowd.push({
                x    : col * (W / cols) + Math.random() * 5 - 2.5,
                y    : row * (CROWD_H / 4) + CROWD_H / 8 + Math.random() * 4,
                hr   : Math.random() * 3 + 3.5,
                color: colors[Math.floor(Math.random() * colors.length)],
                wave : Math.random() * Math.PI * 2,
            });
        }
    }
}

/* ══════════════════════════════════════════
   AUDIO
══════════════════════════════════════════ */

function playKick() {
    try {
        const a = Kit.audio(), o = a.createOscillator(), g = a.createGain();
        o.connect(g); g.connect(a.destination);
        o.frequency.setValueAtTime(90, a.currentTime);
        o.frequency.exponentialRampToValueAtTime(25, a.currentTime + 0.18);
        g.gain.setValueAtTime(0.55, a.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.18);
        o.start(); o.stop(a.currentTime + 0.18);
    } catch(e){}
}

function playGoalSnd() {
    try {
        const a = Kit.audio();
        [[0, 330, 440],[0.22, 440, 550],[0.44, 550, 880]].forEach(([d, f1, f2]) => {
            const o = a.createOscillator(), g = a.createGain();
            o.type = 'sawtooth'; o.connect(g); g.connect(a.destination);
            o.frequency.setValueAtTime(f1, a.currentTime + d);
            o.frequency.linearRampToValueAtTime(f2, a.currentTime + d + 0.2);
            g.gain.setValueAtTime(0.28, a.currentTime + d);
            g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + d + 0.4);
            o.start(a.currentTime + d); o.stop(a.currentTime + d + 0.4);
        });
        const a2 = Kit.audio(), buf = a2.createBuffer(1, a2.sampleRate * 1.2, a2.sampleRate);
        const d  = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/d.length,0.3)*0.3;
        const src = a2.createBufferSource(), f = a2.createBiquadFilter();
        src.buffer = buf; f.type = 'bandpass'; f.frequency.value = 600; f.Q.value = 0.4;
        src.connect(f); f.connect(a2.destination); src.start(a2.currentTime + 0.4);
    } catch(e){}
}

function playSaveSnd() {
    try {
        const a = Kit.audio(), o = a.createOscillator(), g = a.createGain();
        o.type = 'sine'; o.connect(g); g.connect(a.destination);
        o.frequency.setValueAtTime(700, a.currentTime);
        o.frequency.linearRampToValueAtTime(450, a.currentTime + 0.28);
        g.gain.setValueAtTime(0.2, a.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.38);
        o.start(); o.stop(a.currentTime + 0.38);
    } catch(e){}
}

/* ══════════════════════════════════════════
   DRAWING
══════════════════════════════════════════ */
function drawPentPatch(x, y, r) {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
        const a = (i * 72 - 90) * Math.PI / 180;
        i === 0
            ? ctx.moveTo(x + Math.cos(a)*r, y + Math.sin(a)*r)
            : ctx.lineTo(x + Math.cos(a)*r, y + Math.sin(a)*r);
    }
    ctx.closePath();
    ctx.fill();
}

function drawBall(x, y, r, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = '#f5f5f5';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111';
    drawPentPatch(0, 0, r * 0.33);
    for (let i = 0; i < 5; i++) {
        const a = (i * 72 - 90) * Math.PI / 180;
        drawPentPatch(Math.cos(a) * r * 0.62, Math.sin(a) * r * 0.62, r * 0.22);
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
}

function drawGoalie(x, y, lean) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(lean * 0.3);
    const armW = 34 + Math.abs(lean) * 20;

    // Left arm + glove
    ctx.fillStyle = '#ff6600';
    ctx.fillRect(-20 - armW, -40, armW, 13);
    ctx.fillStyle = '#16a34a';
    ctx.beginPath(); ctx.arc(-20 - armW, -34, 13, 0, Math.PI * 2); ctx.fill();

    // Right arm + glove
    ctx.fillStyle = '#ff6600';
    ctx.fillRect(20, -40, armW, 13);
    ctx.fillStyle = '#16a34a';
    ctx.beginPath(); ctx.arc(20 + armW, -34, 13, 0, Math.PI * 2); ctx.fill();

    // Body
    ctx.fillStyle = '#ff6600';
    ctx.fillRect(-20, -52, 40, 46);

    // Shorts
    ctx.fillStyle = '#14532d';
    ctx.fillRect(-18, -6, 36, 22);

    // Socks + boots
    ctx.fillStyle = '#e5e7eb';
    ctx.fillRect(-15, 16, 12, 20); ctx.fillRect(3, 16, 12, 20);
    ctx.fillStyle = '#111';
    ctx.fillRect(-16, 32, 14, 9); ctx.fillRect(2, 32, 14, 9);

    // Head + hair
    ctx.fillStyle = '#fcd9a0';
    ctx.beginPath(); ctx.arc(0, -66, 20, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7c3aed';
    ctx.beginPath(); ctx.arc(0, -73, 15, Math.PI, 0); ctx.fill();

    // Eyes
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(-7, -66, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc( 7, -66, 3.5, 0, Math.PI * 2); ctx.fill();

    // Mouth
    if (Math.abs(lean) < 0.4) {
        ctx.strokeStyle = '#7c3a1a'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, -62, 7, 0.2, Math.PI - 0.2); ctx.stroke();
    } else {
        ctx.fillStyle = '#7c3a1a';
        ctx.beginPath(); ctx.ellipse(0, -60, 5, 4, 0, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();
}

function draw(t) {
    ctx.clearRect(0, 0, W, H);

    // Sky / stadium
    const sky = ctx.createLinearGradient(0, 0, 0, CROWD_H);
    sky.addColorStop(0, '#0f172a');
    sky.addColorStop(1, '#1e3a5f');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, CROWD_H);

    // Crowd
    crowd.forEach(p => {
        const wb = Math.sin(t * 1.9 + p.wave);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 4, p.y, 8, p.hr * 2);
        ctx.fillStyle = '#fcd9a0';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.hr, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = p.color; ctx.lineWidth = 3.5;
        ctx.beginPath(); ctx.moveTo(p.x + 4, p.y + p.hr);
        ctx.lineTo(p.x + 12, p.y - 6 + wb * 7); ctx.stroke();
    });

    // Field
    const field = ctx.createLinearGradient(0, CROWD_H, 0, H);
    field.addColorStop(0,   '#1a6b35');
    field.addColorStop(0.4, '#1e8040');
    field.addColorStop(1,   '#22994a');
    ctx.fillStyle = field;
    ctx.fillRect(0, CROWD_H, W, H - CROWD_H);

    // Grass stripes
    ctx.globalAlpha = 0.07; ctx.fillStyle = '#fff';
    for (let i = 0; i < 10; i += 2) {
        ctx.fillRect(0, CROWD_H + i * (H - CROWD_H) / 10, W, (H - CROWD_H) / 10);
    }
    ctx.globalAlpha = 1;

    // Penalty box lines
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2;
    ctx.strokeRect(W * 0.16, GT, W * 0.68, GH + H * 0.15);

    // Penalty spot
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(W / 2, BALL_SY - H * 0.05, 5, 0, Math.PI * 2); ctx.fill();

    // Goal net (dark fill + grid)
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.fillRect(GL, GT, GW, GH);
    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1;
    for (let i = 0; i <= 14; i++) {
        const x = GL + i * GW / 14;
        ctx.beginPath(); ctx.moveTo(x, GT); ctx.lineTo(x, GB); ctx.stroke();
    }
    for (let i = 0; i <= 8; i++) {
        const y = GT + i * GH / 8;
        ctx.beginPath(); ctx.moveTo(GL, y); ctx.lineTo(GR, y); ctx.stroke();
    }

    // Net ripple on goal
    if (netRipple && netRipple.a > 0) {
        ctx.strokeStyle = `rgba(255,255,255,${netRipple.a})`;
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(netRipple.x, netRipple.y, netRipple.r, 0, Math.PI * 2); ctx.stroke();
    }

    // Goal posts + crossbar (bright white, thick)
    const pw = 12;
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(200,200,255,0.6)'; ctx.shadowBlur = 10;
    ctx.fillRect(GL - pw / 2, GT - pw / 2, pw, GH + pw);  // left post
    ctx.fillRect(GR - pw / 2, GT - pw / 2, pw, GH + pw);  // right post
    ctx.fillRect(GL - pw / 2, GT - pw / 2, GW + pw, pw);  // crossbar
    ctx.shadowBlur = 0;

    // Goal line
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(0, GB); ctx.lineTo(W, GB); ctx.stroke();

    // Goalie
    const lean = state === S.READY ? 0
        : (gdest !== null ? Math.sign(gdest - W / 2) * Math.min(1, bp * 2.5) : 0);
    const gy = GB - 10
        + (state === S.READY ? Math.sin(t * 1.4) * 3 : 0)
        + (state === S.SCORED ? -Math.abs(Math.sin(t * 6)) * 16 : 0);
    drawGoalie(gx, gy, lean);

    // Ball shadow (only on ground)
    if (state === S.READY || state === S.RESET) {
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.beginPath(); ctx.ellipse(W / 2, BALL_SY + 18, 20, 5, 0, 0, Math.PI * 2); ctx.fill();
    }

    // Ball in flight
    if (state === S.FLYING || state === S.READY || state === S.RESET) {
        const br = (state === S.READY || state === S.RESET) ? 22 : 22 - bp * 9;
        drawBall(bx, by, br, brot);
    }
    // Ball resting in net after goal
    if (state === S.SCORED) {
        drawBall(btx, bty, 13, brot);
    }

    // Dust/grass particles on kick
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life -= 0.045;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    // Tap hint
    document.getElementById('tapHint').style.display = state === S.READY ? '' : 'none';
}

/* ══════════════════════════════════════════
   GAME LOGIC
══════════════════════════════════════════ */
function shoot(tx, ty) {
    if (state !== S.READY) return;

    // Map tap position to goal target
    btx = Math.max(GL + 12, Math.min(GR - 12, tx));
    // Vertical: top 30% of goal by default, with slight input influence
    const hFactor = Math.max(0, Math.min(1, (ty - GT) / (H - GT)));
    bty = GT + GH * (0.15 + hFactor * 0.6);

    bsx = W / 2;
    bsy = BALL_SY;

    // Determine outcome (forgiving: ~75% goal rate)
    const distFromGoalie = Math.abs(btx - gx);
    const cornerPct      = Math.min(1, distFromGoalie / (GW * 0.38));
    const savePct        = 0.70 - cornerPct * 0.40; // 30–70% save rate (avg ~50% goal)
    outcome = Math.random() < savePct ? 'save' : 'goal';

    // Goalie dive direction
    if (outcome === 'goal') {
        gdest = btx > W / 2 ? GL + 40 : GR - 40; // dives wrong way
    } else {
        gdest = btx;
    }

    state = S.FLYING;
    bp    = 0;
    playKick();
    kickDust(bsx, bsy);
}

function kickDust(x, y) {
    const cols = ['#22c55e','#16a34a','#a3e635','#fff','#d4d4d4'];
    for (let i = 0; i < 12; i++) {
        const a = Math.random() * Math.PI * 2, spd = Math.random() * 4 + 2;
        particles.push({ x, y,
            vx: Math.cos(a)*spd, vy: Math.sin(a)*spd - 2,
            r: Math.random()*3+2, life: 1,
            c: cols[Math.floor(Math.random()*cols.length)] });
    }
}

function onGoal() {
    score++;
    document.getElementById('scoreNum').textContent = score;

    const subs = ['Amazing! ⭐','She scores! 🎉','Superstar!','Brilliant!','What a shot! 💥'];
    document.getElementById('goalSub').textContent = subs[Math.floor(Math.random()*subs.length)];
    document.getElementById('goalWord').classList.add('show');
    document.getElementById('goalSub').classList.add('show');
    document.getElementById('flash').classList.add('on');
    setTimeout(() => document.getElementById('flash').classList.remove('on'), 180);

    Kit.confetti(100);
    playGoalSnd();
    netRipple = { x: btx, y: bty, r: 6, a: 0.9 };
}

function onSave() {
    const w = document.getElementById('saveWord');
    w.textContent = '🧤 Great Save!';
    w.classList.add('show');
    playSaveSnd();
    setTimeout(() => w.classList.remove('show'), 1200);
}

function doReset() {
    state = S.RESET; stateTimer = 0;
}

/* ══════════════════════════════════════════
   GAME LOOP
══════════════════════════════════════════ */
let prevTS = 0;

function loop(ts) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (ts - prevTS) / 1000);
    prevTS   = ts;
    const t  = ts / 1000;

    if (state === S.READY) {
        // Goalie oscillates
        gx += gvx;
        if (gx > GR - 45) { gx = GR - 45; gvx = -Math.abs(gvx); }
        if (gx < GL + 45) { gx = GL + 45; gvx =  Math.abs(gvx); }
        bx = W / 2; by = BALL_SY;

    } else if (state === S.FLYING) {
        bp = Math.min(1, bp + dt * 1.85);
        // Ball arcs toward target
        bx   = bsx + (btx - bsx) * bp;
        by   = bsy + (bty - bsy) * bp - Math.sin(bp * Math.PI) * H * 0.13;
        brot += dt * 12;
        // Goalie dives (reacts at 28% of flight)
        if (bp > 0.28 && gdest !== null) {
            gx += (gdest - gx) * Math.min(1, dt * 7);
        }
        // Ripple update
        if (netRipple) { netRipple.r += 70*dt; netRipple.a -= dt*1.4; }

        if (bp >= 1) {
            if (outcome === 'goal') { state = S.SCORED; stateTimer = 0; onGoal(); }
            else                    { state = S.SAVED;  stateTimer = 0; onSave(); }
        }

    } else if (state === S.SCORED) {
        stateTimer += dt;
        if (netRipple) { netRipple.r += 60*dt; netRipple.a -= dt*1.1; }
        if (stateTimer > 2.1) doReset();

    } else if (state === S.SAVED) {
        stateTimer += dt;
        if (stateTimer > 1.4) doReset();

    } else if (state === S.RESET) {
        stateTimer += dt;
        // Goalie slides back to center
        gx += (W / 2 - gx) * Math.min(1, dt * 5);
        bx  = W / 2; by = BALL_SY;
        if (stateTimer > 0.45) {
            state   = S.READY;
            brot    = 0;
            gdest   = null;
            netRipple = null;
            document.getElementById('goalWord').classList.remove('show');
            document.getElementById('goalSub').classList.remove('show');
        }
    }

    draw(t);
}

/* ══════════════════════════════════════════
   INPUT
══════════════════════════════════════════ */
canvas.addEventListener('touchend', e => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    const t = e.changedTouches[0];
    shoot(t.clientX - r.left, t.clientY - r.top);
}, { passive: false });

canvas.addEventListener('click', e => {
    shoot(e.clientX, e.clientY);
});

/* ══════════════════════════════════════════
   BOOT
══════════════════════════════════════════ */
init();
window.addEventListener('resize', init);
requestAnimationFrame(loop);
</script>
</body>
