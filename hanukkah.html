<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🕎 Light the Menorah — Ellie & Grandpa</title>
    <link rel="stylesheet" href="shared/kit.css?v=3">
    <style>
        body {
            min-height: 100vh;
            min-height: 100dvh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Rounded, sans-serif;
            background: linear-gradient(135deg, #1a0040, #0a1560, #2d0060, #0a1560, #1a0040);
            background-size: 400% 400%;
            animation: bgShift 12s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 14px 20px;
            overflow-x: hidden;
            color: white;
            touch-action: none;
        }

        /* ── Layout ── */
        .game {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* ── Top bar: back + title ── */
        .top-bar {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h1 {
            flex: 1;
            text-align: center;
            font-size: 1.45rem;
            font-weight: 900;
            text-shadow: 0 0 20px rgba(255,200,80,0.8);
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* ── Status pill ── */
        .status {
            width: 100%;
            background: rgba(255,255,255,0.1);
            border: 1.5px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            padding: 8px 16px;
            font-size: 1rem;
            font-weight: 700;
            text-align: center;
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        .status.happy { background: rgba(255,215,0,0.22); border-color: #ffd700; }

        /* ── Window scene ── */
        .scene {
            position: relative;
            width: 100%;
            height: clamp(230px, calc(100dvh - 346px), 480px);
            border-radius: 24px;
            overflow: hidden;
            background: linear-gradient(180deg, #0b1440 0%, #1b2f6b 70%, #2c4a8a 100%);
            border: 8px solid #8d5a3b;
            box-shadow: 0 6px 24px rgba(0,0,0,0.35), inset 0 0 0 2px rgba(0,0,0,0.25);
            transition: box-shadow 0.8s;
        }
        .scene.glow { box-shadow: 0 0 40px rgba(255,190,80,0.6), inset 0 0 60px rgba(255,190,80,0.35); }
        .moon { position: absolute; top: 6%; right: 9%; font-size: 1.7rem; line-height: 1; pointer-events: none; }
        .outside-snow {
            position: absolute;
            left: -10%;
            right: -10%;
            height: 40px;
            background: linear-gradient(180deg, #ffffff, #d3e3f6);
            border-radius: 50% 50% 0 0 / 60% 60% 0 0;
        }
        .mullion { position: absolute; background: #8d5a3b; box-shadow: 0 0 0 1px rgba(0,0,0,0.2); }
        .mullion.v { top: 0; bottom: 0; left: 50%; width: 6px; transform: translateX(-50%); }
        .mullion.h { left: 0; right: 0; top: 40%; height: 6px; }
        .sill {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, #b07a52 0%, #8d5a3b 18%, #6f4428 100%);
            box-shadow: 0 -3px 8px rgba(0,0,0,0.3);
        }

        .flakes { position: absolute; inset: 0; pointer-events: none; }
        .flake {
            position: absolute;
            top: -10px;
            border-radius: 50%;
            background: white;
            opacity: 0.85;
            animation: snowfall var(--t) linear var(--delay) infinite;
        }
        @keyframes snowfall {
            to { transform: translate(var(--drift), 520px); }
        }

        /* The menorah and decorations live on a 300×300 "stage", sized by layout().
           --u is one stage unit in px, so everything scales together. */
        .stage {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        .stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

        /* ── Decorations (and candles) ── */
        .deco {
            position: absolute;
            width:  calc(var(--u) * var(--w));
            height: calc(var(--u) * var(--h));
            transform: translate(-50%, -50%);
            touch-action: none;
            cursor: grab;
        }
        .deco::before { content: ''; position: absolute; inset: -10px; }   /* bigger touch target */
        .deco svg { position: relative; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
        .deco.pop { animation: decoIn 0.35s cubic-bezier(0.34, 1.6, 0.64, 1); }
        @keyframes decoIn {
            from { transform: translate(-50%, -50%) scale(0.3); }
        }
        .deco.candle { z-index: 2; }
        .deco.nudge { animation: nudge 0.4s ease; }
        @keyframes nudge {
            25% { transform: translate(-60%, -50%); }
            75% { transform: translate(-40%, -50%); }
        }

        /* Candle flame: hidden until lit, then flickers with a warm glow */
        .flame {
            position: absolute;
            left: 50%;
            bottom: 96%;
            width:  calc(var(--u) * 10);
            height: calc(var(--u) * 17);
            transform: translateX(-50%);
            transform-origin: 50% 90%;
            border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
            background: radial-gradient(ellipse at 50% 72%, #ffffff 0%, #fff3bf 22%, #ffd43b 42%, #ff922b 68%, rgba(255,120,40,0) 74%);
            pointer-events: none;
            display: none;
            animation: flicker var(--fl, 0.18s) ease-in-out infinite alternate;
        }
        .flame::after {
            content: '';
            position: absolute;
            inset: -120% -160%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,200,90,0.45) 0%, rgba(255,170,60,0) 60%);
        }
        .deco.lit .flame { display: block; }
        @keyframes flicker {
            from { transform: translateX(-50%) scale(1, 1)    rotate(-3deg); }
            to   { transform: translateX(-50%) scale(0.9, 1.1) rotate(3deg); }
        }
        .flying-flame {
            position: fixed;
            z-index: 300;
            pointer-events: none;
            border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
            background: radial-gradient(ellipse at 50% 72%, #ffffff 0%, #fff3bf 22%, #ffd43b 42%, #ff922b 68%, rgba(255,120,40,0) 74%);
            filter: drop-shadow(0 0 8px rgba(255,190,80,0.9));
            transform: translate(-50%, -50%);
        }
        .flying-flame.travel { transition: left 0.35s ease-in-out, top 0.35s ease-in-out; }

        /* Dreidel spin: whirl around, wobble, then settle on a letter */
        .deco.dreidel svg { transform-origin: 50% 80%; }
        .deco.dreidel.spinning svg { animation: dreidelSpin 1.6s cubic-bezier(0.2, 0.6, 0.3, 1); }
        @keyframes dreidelSpin {
            0%   { transform: perspective(200px) rotateY(0)       rotateZ(0); }
            20%  { transform: perspective(200px) rotateY(500deg)  rotateZ(-6deg); }
            50%  { transform: perspective(200px) rotateY(1100deg) rotateZ(6deg); }
            80%  { transform: perspective(200px) rotateY(1350deg) rotateZ(-10deg); }
            100% { transform: perspective(200px) rotateY(1440deg) rotateZ(0); }
        }

        .sparkle {
            position: absolute;
            font-size: calc(var(--u) * 20);
            line-height: 1;
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: sparkleOut 1s ease-out forwards;
        }
        @keyframes sparkleOut {
            to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.4); opacity: 0; }
        }

        /* Dragged copy, in screen coordinates */
        .drag-clone {
            position: fixed;
            z-index: 300;
            pointer-events: none;
            filter: drop-shadow(0 8px 10px rgba(0,0,0,0.45));
        }
        .drag-clone.flying { transition: left 0.2s ease, top 0.2s ease; }
        .drag-clone.poof {
            transition: transform 0.25s ease, opacity 0.25s ease;
            transform: translate(-50%, -50%) scale(0.2);
            opacity: 0;
        }

        /* ── Tabs + clear ── */
        .tabs { display: flex; gap: 6px; width: 100%; }
        .tab {
            flex: 1 1 auto;
            min-width: 0;
            height: 38px;
            padding: 0 6px;
            border-radius: 50px;
            border: 1.5px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: white;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            touch-action: none;
            white-space: nowrap;
        }
        .tab.active { background: rgba(255,215,0,0.22); border-color: #ffd700; }
        .tab.clear-btn.armed { background: rgba(244,63,94,0.35); border-color: #f43f5e; }
        @media (max-width: 370px) { .tab { font-size: 0.75rem; } }

        /* ── Tray ── */
        .tray {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));   /* minmax: WebKit otherwise lets the items push the columns wider */
            align-content: center;
            gap: 6px;
            padding: 10px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 20px;
        }
        .tray-item {
            min-width: 0;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 14px;
            cursor: grab;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .tray-item:active { transform: scale(0.92); }
        .tray-item svg { width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    </style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="confetti-wrap" id="confetti"></div>

<div class="game">

    <!-- Top bar -->
    <div class="top-bar">
        <a class="back-btn" href="index.html">← Games</a>
        <h1>🕎 Menorah!</h1>
        <div class="top-spacer"></div>
    </div>

    <!-- Status -->
    <div class="status" id="status">🕎 Put candles in the menorah!</div>

    <!-- Window scene with the menorah on the sill -->
    <div class="scene" id="scene">
        <div class="flakes" id="flakes"></div>
        <div class="moon">🌙</div>
        <div class="outside-snow" id="outsideSnow"></div>
        <div class="mullion v"></div>
        <div class="mullion h"></div>
        <div class="sill" id="sill"></div>
        <div class="stage" id="stage">
            <svg viewBox="0 0 300 300" aria-label="Menorah" id="menorah"></svg>
            <div id="decos"></div>
        </div>
    </div>

    <!-- Tabs + clear -->
    <div class="tabs" id="tabs"></div>
    <div class="tray" id="tray"></div>

</div>

<script src="shared/kit.js?v=3"></script>
<script>
    /* ── Menorah shape (stage units, 300×300) ── */
    // Nine holders: four on each side and the taller shamash (helper candle) in the middle.
    // y is the top of each cup, where a candle stands.
    const HOLDERS = [30, 60, 90, 120, 150, 180, 210, 240, 270].map(x => ({ x, y: x === 150 ? 112 : 148 }));
    const SHAMASH  = 4;
    const CANDLE_H = 40;
    const TABLE_Y  = 262;   // things on the windowsill sit with their bottom here
    const MAX_DECOS = 100;

    document.getElementById('menorah').innerHTML =
        '<g fill="#f2c94c" stroke="#b8901f" stroke-width="2" stroke-linejoin="round">' +
        '<path d="M112 262 L188 262 L174 244 L126 244 Z"/>' +
        '<rect x="146" y="120" width="8" height="126"/>' +
        '<rect x="22" y="160" width="256" height="9" rx="4.5"/>' +
        HOLDERS.map((h, i) => (i === SHAMASH ? '' : `<rect x="${h.x - 3}" y="${h.y + 6}" width="6" height="8"/>`) +
            `<rect x="${h.x - 9}" y="${h.y}" width="18" height="8" rx="2"/>`).join('') +
        '</g>';

    /* ── Drawings ── */
    const candle = c => `<svg viewBox="0 0 10 40"><line x1="5" y1="0" x2="5" y2="5" stroke="#3b3b3b" stroke-width="1.3"/>` +
        `<rect x="1" y="4" width="8" height="36" rx="1.5" fill="${c}" stroke="rgba(0,0,0,0.15)" stroke-width="0.6"/>` +
        `<rect x="2.2" y="6" width="1.8" height="32" rx="0.9" fill="white" opacity="0.4"/></svg><div class="flame"></div>`;
    const dreidel = (c, edge, letter) => `<svg viewBox="0 0 40 56"><rect x="16.5" y="0" width="7" height="13" rx="2.5" fill="${edge}"/>` +
        `<rect x="4" y="10" width="32" height="30" rx="4" fill="${c}" stroke="${edge}" stroke-width="2"/>` +
        `<path d="M4 37 L36 37 L20 56 Z" fill="${c}" stroke="${edge}" stroke-width="2" stroke-linejoin="round"/>` +
        `<text x="20" y="26" font-size="20" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="white" ` +
        `stroke="rgba(0,0,0,0.35)" stroke-width="0.8" font-family="'Arial Hebrew', 'Noto Sans Hebrew', sans-serif">${letter}</text></svg>`;
    const gift = (w, h, box, ribbon) => `<svg viewBox="0 0 ${w} ${h}">` +
        `<rect x="0" y="${h * 0.22}" width="${w}" height="${h * 0.78}" rx="3" fill="${box}"/>` +
        `<rect x="-2" y="${h * 0.16}" width="${w + 4}" height="${h * 0.16}" rx="2" fill="${box}" stroke="rgba(0,0,0,0.15)"/>` +
        `<rect x="${w / 2 - 4}" y="${h * 0.16}" width="8" height="${h * 0.84}" fill="${ribbon}"/>` +
        `<ellipse cx="${w / 2 - 7}" cy="${h * 0.1}" rx="7" ry="5" fill="${ribbon}"/><ellipse cx="${w / 2 + 7}" cy="${h * 0.1}" rx="7" ry="5" fill="${ribbon}"/></svg>`;
    const davidStar = c => '<svg viewBox="0 0 100 100"><g fill="none" stroke="' + c + '" stroke-width="9" stroke-linejoin="round">' +
        '<polygon points="50,6 89,74 11,74"/><polygon points="50,94 11,26 89,26"/></g></svg>';

    // Everything in the tray: which tab it's in, where it goes, its size (stage units) and its drawing.
    //   place: 'holder' snaps into the menorah, 'sill' sits on the windowsill, 'hang' goes anywhere in the window
    const CATALOG = {
        'candle-blue':   { tab: 'candles', place: 'holder', size: [10, 40], html: candle('#4dabf7') },
        'candle-white':  { tab: 'candles', place: 'holder', size: [10, 40], html: candle('#f8f9fa') },
        'candle-yellow': { tab: 'candles', place: 'holder', size: [10, 40], html: candle('#ffd43b') },
        'candle-pink':   { tab: 'candles', place: 'holder', size: [10, 40], html: candle('#f783ac') },
        'candle-purple': { tab: 'candles', place: 'holder', size: [10, 40], html: candle('#b197fc') },
        'candle-orange': { tab: 'candles', place: 'holder', size: [10, 40], html: candle('#ffa94d') },
        'candle-red':    { tab: 'candles', place: 'holder', size: [10, 40], html: candle('#ff6b6b') },
        'candle-green':  { tab: 'candles', place: 'holder', size: [10, 40], html: candle('#69db7c') },

        'dreidel-blue':   { tab: 'decor', place: 'sill', size: [28, 39], dreidel: ['#1c7ed6', '#0b4f94'] },
        'dreidel-silver': { tab: 'decor', place: 'sill', size: [28, 39], dreidel: ['#adb5bd', '#5c636a'] },
        'dreidel-gold':   { tab: 'decor', place: 'sill', size: [28, 39], dreidel: ['#e8b923', '#9a7410'] },
        'gelt':        { tab: 'decor', place: 'sill', size: [24, 24], html:
            '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#f2c94c" stroke="#b8901f" stroke-width="3"/>' +
            '<circle cx="20" cy="20" r="12.5" fill="none" stroke="#b8901f" stroke-width="1.5"/>' +
            '<g fill="none" stroke="#b8901f" stroke-width="1.8" stroke-linejoin="round"><polygon points="20,11 27.5,24 12.5,24"/><polygon points="20,29 12.5,16 27.5,16"/></g></svg>' },
        'sufganiyah':  { tab: 'decor', place: 'sill', size: [36, 27], html:
            '<svg viewBox="0 0 44 33"><ellipse cx="22" cy="20" rx="20.5" ry="12.5" fill="#c97b34"/><ellipse cx="22" cy="16.5" rx="18.5" ry="10.5" fill="#e3a157"/>' +
            '<g fill="white" opacity="0.92"><circle cx="12" cy="14" r="1.6"/><circle cx="17" cy="19" r="1.4"/><circle cx="28" cy="18" r="1.6"/>' +
            '<circle cx="33" cy="13" r="1.4"/><circle cx="24" cy="21.5" r="1.3"/><circle cx="9" cy="19" r="1.2"/></g>' +
            '<ellipse cx="22" cy="10.5" rx="5" ry="3" fill="#c92a2a"/></svg>' },
        'latkes':      { tab: 'decor', place: 'sill', size: [38, 25], html:
            '<svg viewBox="0 0 48 32"><ellipse cx="24" cy="25" rx="22" ry="6.5" fill="#a8641f"/><ellipse cx="24" cy="22.5" rx="21" ry="6" fill="#d89a3c"/>' +
            '<ellipse cx="24" cy="17" rx="21" ry="6.5" fill="#a8641f"/><ellipse cx="24" cy="14.5" rx="20" ry="6" fill="#e2ab4c"/>' +
            '<ellipse cx="24" cy="9.5" rx="12" ry="4.5" fill="#fff4e0"/><ellipse cx="22" cy="8.5" rx="5" ry="1.8" fill="white"/></svg>' },
        'gift-blue':   { tab: 'decor', place: 'sill', size: [44, 38], html: gift(44, 38, '#1c7ed6', '#e9ecef') },
        'gift-white':  { tab: 'decor', place: 'sill', size: [36, 44], html: gift(36, 44, '#f1f3f5', '#1c7ed6') },
        'star-blue':   { tab: 'decor', place: 'hang', size: [38, 38], html: davidStar('#4dabf7') },
        'star-silver': { tab: 'decor', place: 'hang', size: [38, 38], html: davidStar('#dee2e6') },
        'star-gold':   { tab: 'decor', place: 'hang', size: [38, 38], html: davidStar('#fcc419') },
        'garland':     { tab: 'decor', place: 'hang', size: [110, 34], html:
            '<svg viewBox="0 0 120 38"><path d="M2 5 Q60 24 118 5" fill="none" stroke="#ced4da" stroke-width="2"/>' +
            [[10, '#4dabf7'], [27, '#f8f9fa'], [44, '#4dabf7'], [60, '#f8f9fa'], [76, '#4dabf7'], [93, '#f8f9fa'], [110, '#4dabf7']].map(([x, c]) => {
                const y = 5 + 19 * (1 - Math.pow((x - 60) / 58, 2));   // follows the string's curve
                return `<polygon points="${x - 6},${y - 1} ${x + 6},${y - 1} ${x},${y + 13}" fill="${c}" stroke="rgba(0,0,0,0.15)" stroke-width="0.6"/>`;
            }).join('') + '</svg>' },
    };
    // Dreidels draw with their current letter
    Object.values(CATALOG).forEach(c => { if (c.dreidel) c.html = dreidel(...c.dreidel, 'ש'); });

    const TABS = [
        { id: 'candles', label: '🕯️ Candles' },
        { id: 'decor',   label: '🎁 Decorations' },
    ];
    // The four sides of a dreidel and what each one means in the game.
    const DREIDEL = [
        { letter: 'נ', msg: 'נ Nun: nothing happens!' },
        { letter: 'ג', msg: 'ג Gimel: you win it all! 🎉' },
        { letter: 'ה', msg: 'ה Hey: you win half!' },
        { letter: 'ש', msg: 'ש Shin: put one in!' },
    ];
    const CHIMES = [784, 880, 988, 1175, 1319];

    /* ── State ── */
    let decorations = [];   // { kind, x, y, el, holder, lit, letter } in stage units
    let tab         = 'candles';
    let celebrated  = false;

    const scene   = document.getElementById('scene');
    const stage   = document.getElementById('stage');
    const decosEl = document.getElementById('decos');
    const trayEl  = document.getElementById('tray');

    function candleIn(i) { return decorations.find(d => d.holder === i); }
    function isComplete() { return HOLDERS.every((h, i) => candleIn(i) && candleIn(i).lit); }

    /* ── Placement rules ── */
    // The empty holder nearest (x, y), or -1. `self` is a candle being moved (its own holder counts as empty).
    function freeHolderNear(x, y, self) {
        let best = -1, bestDist = 40;
        HOLDERS.forEach((h, i) => {
            const taken = candleIn(i);
            if (taken && taken !== self) return;
            const d = Math.hypot(x - h.x, y - (h.y - CANDLE_H / 2));
            if (d < bestDist) { best = i; bestDist = d; }
        });
        return best;
    }

    // Where a piece dropped at (x, y) ends up, or null if it doesn't belong there.
    function snap(kind, x, y, self) {
        const { place, size } = CATALOG[kind];
        if (place === 'holder') {
            const i = freeHolderNear(x, y, self);
            return i < 0 ? null : { x: HOLDERS[i].x, y: HOLDERS[i].y - CANDLE_H / 2 + 1, holder: i };
        }
        const cx = Math.min(Math.max(x, 10), 290);
        if (place === 'sill') return { x: cx, y: TABLE_Y - size[1] / 2, holder: null };
        return y < TABLE_Y - size[1] / 2 ? { x: cx, y: Math.max(y, 8), holder: null } : null;   // hang: anywhere above the sill
    }

    function addDecoration(kind, x, y) {
        const pos = snap(kind, x, y);
        if (!pos || decorations.length >= MAX_DECOS) return null;

        const c = CATALOG[kind];
        const el = document.createElement('div');
        el.className = 'deco pop' + (c.place === 'holder' ? ' candle' : '') + (c.dreidel ? ' dreidel' : '');
        el.style.setProperty('--w', c.size[0]);
        el.style.setProperty('--h', c.size[1]);
        el.style.setProperty('--fl', `${(Math.random() * 0.12 + 0.12).toFixed(2)}s`);
        el.innerHTML = c.html;
        const entry = { kind, x: pos.x, y: pos.y, holder: pos.holder, lit: false, letter: 'ש', el };
        el.addEventListener('pointerdown', e => beginDrag(e, kind, entry));
        el.addEventListener('animationend', e => { if (e.animationName === 'decoIn') el.classList.remove('pop'); });
        decosEl.appendChild(el);
        decorations.push(entry);
        position(entry);

        Kit.tone(CHIMES[Math.floor(Math.random() * CHIMES.length)], 0.15, 'sine', 0.14);
        if (entry.holder === SHAMASH) lightCandle(entry);   // the helper candle lights itself
        update();
        return entry;
    }

    function moveDecoration(entry, x, y) {
        const pos = snap(entry.kind, x, y, entry);
        if (!pos) return false;
        Object.assign(entry, { x: pos.x, y: pos.y, holder: pos.holder });
        position(entry);
        Kit.tone(CHIMES[Math.floor(Math.random() * CHIMES.length)], 0.12, 'sine', 0.12);
        if (entry.holder === SHAMASH && !entry.lit) lightCandle(entry);
        update();
        return true;
    }

    function removeDecoration(entry) {
        entry.el.remove();
        decorations = decorations.filter(d => d !== entry);
        update();
    }

    function position(entry) {
        entry.el.style.left = (entry.x / 300 * 100) + '%';
        entry.el.style.top  = (entry.y / 300 * 100) + '%';
    }

    /* ── Lighting ── */
    function lightCandle(entry) {
        if (entry.lit || entry.holder === null) return;
        entry.lit = true;
        entry.el.classList.add('lit');
        Kit.tone(1400, 0.05, 'triangle', 0.08);
        setTimeout(() => Kit.tone(CHIMES[entry.holder % CHIMES.length] * 0.75, 0.25, 'sine', 0.14), 60);
        update();
    }

    // Tapping an unlit candle: a flame hops over from the shamash and lights it.
    function lightFromShamash(entry) {
        const shamash = candleIn(SHAMASH);
        if (!shamash) {
            entry.el.classList.remove('nudge');
            void entry.el.offsetWidth;
            entry.el.classList.add('nudge');
            say('🕯️ First fill the tall middle spot!');
            return;
        }
        const from = shamash.el.querySelector('.flame').getBoundingClientRect();
        const to = entry.el.getBoundingClientRect();
        const f = document.createElement('div');
        f.className = 'flying-flame';
        Object.assign(f.style, { width: from.width + 'px', height: from.height + 'px',
            left: (from.left + from.width / 2) + 'px', top: (from.top + from.height / 2) + 'px' });
        document.body.appendChild(f);
        void f.offsetWidth;
        f.classList.add('travel');
        f.style.left = (to.left + to.width / 2) + 'px';
        f.style.top  = (to.top - from.height / 2) + 'px';
        setTimeout(() => { f.remove(); lightCandle(entry); }, 360);
    }

    /* ── All nine lit: celebrate ── */
    function update() {
        const done = isComplete();
        if (done && !celebrated) celebrate();
        celebrated = done;
        scene.classList.toggle('glow', done);
        if (!sayTimer) showStatus();
    }

    function celebrate() {
        const st = stage.getBoundingClientRect();
        for (let i = 0; i < 14; i++) {
            const s = document.createElement('div');
            s.className = 'sparkle';
            s.textContent = i % 2 ? '✨' : '⭐';
            const a = (i / 14) * Math.PI * 2;
            s.style.left = '50%';
            s.style.top = (110 / 300 * 100) + '%';
            s.style.setProperty('--dx', `${Math.cos(a) * st.width * 0.45}px`);
            s.style.setProperty('--dy', `${Math.sin(a) * st.width * 0.3}px`);
            s.addEventListener('animationend', () => s.remove());
            decosEl.appendChild(s);
        }
        [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) =>
            setTimeout(() => Kit.tone(f, 0.2, 'sine', 0.16), i * 140));
        Kit.confetti(110);
        setTimeout(() => Kit.confetti(70), 900);
    }

    /* ── Status ── */
    let sayTimer = null;
    function showStatus() {
        const placed = decorations.filter(d => d.holder !== null);
        let msg = '🕎 Put candles in the menorah!';
        if (isComplete())                      msg = '✨ Happy Hanukkah! ✨';
        else if (placed.length && !candleIn(SHAMASH)) msg = '🕯️ Now fill the tall middle spot!';
        else if (placed.some(d => !d.lit))     msg = '🔥 Drag the flame to light them!';
        else if (placed.length)                msg = '🕯️ Add more candles!';
        const el = document.getElementById('status');
        el.textContent = msg;
        el.classList.toggle('happy', isComplete());
    }
    // A message for a moment (dreidel results, hints), then back to the usual one
    function say(msg) {
        clearTimeout(sayTimer);
        document.getElementById('status').textContent = msg;
        sayTimer = setTimeout(() => { sayTimer = null; showStatus(); }, 2600);
    }

    /* ── Dreidel ── */
    function spinDreidel(entry) {
        if (entry.spinning) return;
        entry.spinning = true;
        const el = entry.el;
        el.classList.add('spinning');
        for (let i = 0; i < 12; i++) setTimeout(() => Kit.tone(900 - i * 40, 0.03, 'triangle', 0.08), i * 110 + i * i * 4);
        const side = DREIDEL[Math.floor(Math.random() * DREIDEL.length)];
        setTimeout(() => {
            el.classList.remove('spinning');
            entry.spinning = false;
            entry.letter = side.letter;
            el.querySelector('text').textContent = side.letter;
            say(side.msg);
            if (side.letter === 'ג') {
                Kit.confetti(50);
                [784, 988, 1175].forEach((f, i) => setTimeout(() => Kit.tone(f, 0.15, 'sine', 0.15), i * 100));
            } else {
                Kit.tone(660, 0.18, 'sine', 0.14);
            }
        }, 1600);
        return side.letter;
    }

    /* ── Clear: tap twice so one stray tap doesn't wipe everything ── */
    let clearTimer = null;
    function onClear() {
        const btn = document.getElementById('clearBtn');
        if (!btn.classList.contains('armed')) {
            btn.classList.add('armed');
            btn.textContent = 'Tap again';
            clearTimer = setTimeout(disarmClear, 3000);
            return;
        }
        disarmClear();
        clearAll();
    }
    function disarmClear() {
        clearTimeout(clearTimer);
        const btn = document.getElementById('clearBtn');
        btn.classList.remove('armed');
        btn.textContent = '🗑️ Clear';
    }
    function clearAll() {
        [...decorations].forEach(d => d.el.remove());
        decorations = [];
        update();
        [523, 440, 349, 262].forEach((f, i) => setTimeout(() => Kit.tone(f, 0.1, 'triangle', 0.12), i * 60));
    }

    /* ── Tabs + tray ── */
    function renderTabs() {
        document.getElementById('tabs').innerHTML = TABS.map(t =>
            `<button class="tab${t.id === tab ? ' active' : ''}" onclick="showTab('${t.id}')">${t.label}</button>`).join('') +
            '<button class="tab clear-btn" id="clearBtn" onclick="onClear()">🗑️ Clear</button>';
    }

    function showTab(id) {
        tab = id;
        clearTimeout(clearTimer);   // re-rendering the tabs also resets the Clear button
        renderTabs();
        trayEl.innerHTML = '';
        Object.entries(CATALOG).filter(([, c]) => c.tab === id).forEach(([kind, c]) => {
            const item = document.createElement('div');
            item.className = 'tray-item';
            item.dataset.kind = kind;
            item.innerHTML = c.html;
            item.addEventListener('pointerdown', e => beginDrag(e, kind, null));
            trayEl.appendChild(item);
        });
    }

    /* ── Dragging ── */
    // From the tray: a new piece. A placed piece: move it, or tap it (light a candle / spin a dreidel).
    // The lit shamash: drag its flame over other candles to light them.
    let drag = null;

    function unit() { return stage.getBoundingClientRect().width / 300; }

    function beginDrag(e, kind, entry) {
        if (drag) return;
        e.preventDefault();
        if (entry && entry.holder === SHAMASH && entry.lit) return beginFlameDrag(e, entry);

        const u = unit();
        const [w, h] = CATALOG[kind].size;
        const clone = document.createElement('div');
        clone.className = 'deco drag-clone' + (entry && entry.lit ? ' lit' : '');
        clone.style.setProperty('--u', u + 'px');
        clone.style.setProperty('--w', w);
        clone.style.setProperty('--h', h);
        clone.innerHTML = entry ? entry.el.innerHTML : CATALOG[kind].html;
        document.body.appendChild(clone);

        let ox = 0, oy = -(h * u * 0.6 + 14);   // from the tray: float just above the finger
        if (entry) {
            const r = entry.el.getBoundingClientRect();
            ox = r.left + r.width / 2 - e.clientX;
            oy = r.top + r.height / 2 - e.clientY;
            entry.el.style.visibility = 'hidden';
        }
        drag = { kind, entry, clone, ox, oy, from: e.currentTarget, sx: e.clientX, sy: e.clientY };
        moveClone(e.clientX, e.clientY);
        Kit.tone(660, 0.06, 'sine', 0.1);
    }

    function beginFlameDrag(e, shamash) {
        const r = shamash.el.querySelector('.flame').getBoundingClientRect();
        const f = document.createElement('div');
        f.className = 'flying-flame';
        f.style.width  = (r.width * 1.6) + 'px';
        f.style.height = (r.height * 1.6) + 'px';
        document.body.appendChild(f);
        drag = { flame: f, ox: 0, oy: -(r.height * 1.6), sx: e.clientX, sy: e.clientY };
        moveClone(e.clientX, e.clientY);
        Kit.tone(1200, 0.05, 'triangle', 0.08);
    }

    function moveClone(cx, cy) {
        const el = drag.flame || drag.clone;
        el.style.left = (cx + drag.ox) + 'px';
        el.style.top  = (cy + drag.oy) + 'px';
        if (drag.flame) {
            // Light any unlit candle the flame touches
            const fx = cx + drag.ox, fy = cy + drag.oy;
            decorations.forEach(d => {
                if (d.lit || d.holder === null) return;
                const r = d.el.getBoundingClientRect();
                if (fx > r.left - 14 && fx < r.right + 14 && fy > r.top - 30 && fy < r.bottom) lightCandle(d);
            });
        }
    }

    document.addEventListener('pointermove', e => { if (drag) moveClone(e.clientX, e.clientY); });

    function endDrag(e) {
        if (!drag) return;
        const d = drag;
        drag = null;
        if (d.flame) { d.flame.remove(); return; }

        const { kind, entry, clone, from } = d;
        const tapped = Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < 8;

        if (entry && tapped) {
            // A tap on a placed piece
            entry.el.style.visibility = '';
            clone.remove();
            if (CATALOG[kind].dreidel) spinDreidel(entry);
            else if (entry.holder !== null && !entry.lit) lightFromShamash(entry);
            return;
        }

        // The piece's center, in stage units
        const cx = parseFloat(clone.style.left);
        const cy = parseFloat(clone.style.top);
        const sr = scene.getBoundingClientRect();
        const st = stage.getBoundingClientRect();
        const inScene = e.type === 'pointerup' && cx >= sr.left && cx <= sr.right && cy >= sr.top && cy <= sr.bottom;
        const x = (cx - st.left) / st.width * 300;
        const y = (cy - st.top) / st.height * 300;

        let placed = null;
        if (inScene && !tapped) {
            if (entry) placed = moveDecoration(entry, x, y) ? entry : null;
            else       placed = addDecoration(kind, x, y);
        }

        if (placed) {
            placed.el.style.visibility = '';
            clone.remove();
        } else if (entry) {
            removeDecoration(entry);   // dragged off: it goes away
            poof(clone);
        } else {
            // Didn't fit (or just a tap on the tray): float back
            const r = from.getBoundingClientRect();
            clone.classList.add('flying');
            clone.style.left = (r.left + r.width / 2) + 'px';
            clone.style.top  = (r.top + r.height / 2) + 'px';
            if (!tapped) Kit.tone(240, 0.12, 'triangle', 0.12);
            setTimeout(() => clone.remove(), 220);
        }
    }
    document.addEventListener('pointerup', endDrag);
    document.addEventListener('pointercancel', endDrag);

    function poof(clone) {
        clone.classList.add('poof');
        Kit.tone(330, 0.08, 'triangle', 0.12);
        setTimeout(() => Kit.tone(220, 0.1, 'triangle', 0.1), 70);
        setTimeout(() => clone.remove(), 260);
    }

    /* ── Fit the square stage inside the scene ── */
    function layout() {
        const s = Math.min(scene.clientWidth, scene.clientHeight);
        stage.style.width = stage.style.height = s + 'px';
        stage.style.setProperty('--u', (s / 300) + 'px');
        // Windowsill top lines up with stage y = 252; outside snow just above it
        const sillH = s * 48 / 300;
        document.getElementById('sill').style.height = sillH + 'px';
        document.getElementById('outsideSnow').style.bottom = (sillH - 12) + 'px';

        // Keep the tray two rows tall on every tab, so the page doesn't jump around
        const cell = (trayEl.clientWidth - 20 - 5 * 6) / 6;
        trayEl.style.minHeight = (2 * cell + 6 + 24) + 'px';
    }
    window.addEventListener('resize', layout);

    /* ── Falling snow outside ── */
    const flakesEl = document.getElementById('flakes');
    for (let i = 0; i < 24; i++) {
        const f = document.createElement('div');
        f.className = 'flake';
        const sz = (Math.random() * 4 + 2).toFixed(1);
        f.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random() * 100}%;` +
            `--t:${(Math.random() * 5 + 6).toFixed(1)}s;--delay:-${(Math.random() * 10).toFixed(1)}s;--drift:${(Math.random() * 40 - 20).toFixed(0)}px`;
        flakesEl.appendChild(f);
    }

    /* ── Start ── */
    layout();
    showTab('candles');
    showStatus();
</script>
</body>
</html>
