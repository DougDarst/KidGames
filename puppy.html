<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wash the Puppy!</title>
    <link rel="stylesheet" href="shared/kit.css?v=1">
    <style>
        html, body { height:100%; height:100dvh; overflow:hidden;
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
        body { display:flex; flex-direction:column; }

        /* ── Top bar ── */
        .top-bar {
            flex-shrink:0; display:flex; align-items:center; gap:10px;
            padding:12px 14px 10px;
            background:linear-gradient(135deg,#1a0040,#2d0060);
            border-bottom:2px solid rgba(255,255,255,0.10);
        }
        h1 { flex:1; text-align:center; font-size:1.25rem; font-weight:900; color:#fff;
             text-shadow:0 0 20px rgba(255,200,80,0.9); }
        #hint-top { flex-shrink:0; font-size:0.8rem; font-weight:700;
                    color:rgba(255,255,255,0.65); white-space:nowrap; }

        /* ── Scene wrap (bathtub feel) ── */
        #wrap {
            flex:1; display:flex; align-items:center; justify-content:center;
            padding:20px 16px;
            background:linear-gradient(180deg,#1a6b8a,#0d4060);
        }
        #scene {
            position:relative;
            width:min(320px,100%);
            aspect-ratio:5/6.4;
            background:linear-gradient(180deg,#e8f8ff,#c8f0ff);
            border-radius:32px; overflow:hidden;
            box-shadow:0 10px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.6);
            border:3px solid rgba(255,255,255,0.35);
        }

        /* ── SVG puppy ── */
        #pup { position:absolute; inset:0; width:100%; height:100%; }

        /* ── Mud canvas (sits on top, gets erased) ── */
        #mc {
            position:absolute; inset:0; width:100%; height:100%;
            touch-action:none; cursor:crosshair;
        }

        /* ── Sponge ── */
        #sponge {
            position:absolute; z-index:20;
            font-size:min(12vw,48px); line-height:1;
            transform:translate(-50%,-50%);
            display:none; pointer-events:none;
            filter:drop-shadow(0 3px 8px rgba(80,180,255,0.7));
            animation:sWobble 0.18s ease-in-out infinite;
        }
        @keyframes sWobble {
            0%,100%{transform:translate(-50%,-50%) rotate(-10deg) scale(1)}
            50%    {transform:translate(-50%,-50%) rotate(10deg) scale(1.08)}
        }

        /* ── Floating bubbles ── */
        #bubs { position:absolute; inset:0; pointer-events:none; z-index:15; overflow:hidden; }
        .bub {
            position:absolute;
            border-radius:50%;
            border:2px solid rgba(120,210,255,0.75);
            background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.65), rgba(180,230,255,0.15));
            transform:translate(-50%,-50%);
            pointer-events:none;
            animation:bubUp 1.5s ease-out forwards;
        }
        @keyframes bubUp {
            0%  {transform:translate(-50%,-50%) scale(0.1); opacity:0}
            12% {opacity:1}
            100%{transform:translate(-50%,calc(-50% - 95px)) scale(1.1); opacity:0}
        }

        /* ── Hint text at bottom of scene ── */
        #scrub-hint {
            position:absolute; bottom:10px; left:0; right:0;
            text-align:center; font-size:0.8rem; font-weight:700;
            color:rgba(0,80,130,0.65); pointer-events:none; z-index:5;
            animation:hintPulse 2s ease-in-out infinite;
        }
        @keyframes hintPulse { 0%,100%{opacity:0.5} 50%{opacity:1} }

        /* ── Water spray drops ── */
        .wdrop {
            position:absolute; top:-12px;
            border-radius:3px;
            background:rgba(100,190,255,0.85);
        }
        @keyframes wrain {
            0%  {transform:translateY(0) scaleY(1); opacity:0.9}
            100%{transform:translateY(115%) scaleY(1.4); opacity:0}
        }

        /* ── Win overlay ── */
        #win {
            position:fixed; inset:0; z-index:100;
            display:flex; align-items:center; justify-content:center;
            background:rgba(5,0,20,0.78); backdrop-filter:blur(5px);
            opacity:0; pointer-events:none; transition:opacity 0.4s;
        }
        #win.show { opacity:1; pointer-events:all; }
        .win-card {
            background:linear-gradient(135deg,#1a0060,#0a2060);
            border:2px solid rgba(255,215,0,0.45); border-radius:28px;
            padding:36px 44px; text-align:center; color:#fff;
            display:flex; flex-direction:column; align-items:center; gap:14px;
            box-shadow:0 20px 60px rgba(0,0,0,0.5);
            transform:scale(0); transition:transform 0.5s cubic-bezier(0.34,1.6,0.64,1);
        }
        #win.show .win-card { transform:scale(1); }
        #win-star { font-size:3.6rem; animation:starSpin 0.6s ease-out 0.2s both; }
        @keyframes starSpin {
            0%{transform:rotate(-40deg) scale(0)} 100%{transform:rotate(0) scale(1)}
        }
        .win-title { font-size:2.3rem; font-weight:900; color:#ffd700;
                     text-shadow:0 0 24px rgba(255,215,0,0.6); }
        .win-sub   { font-size:1rem; opacity:0.8; }
        .wash-btn  {
            background:linear-gradient(135deg,#38bdf8,#2563eb);
            border:none; border-radius:50px; padding:13px 36px;
            color:#fff; font-size:1rem; font-weight:800;
            cursor:pointer; touch-action:manipulation;
            box-shadow:0 4px 20px rgba(0,100,255,0.35);
        }
        .wash-btn:active { filter:brightness(1.15); }
    </style>
</head>
<body>

<div class="top-bar">
    <a class="back-btn" href="index.html">&#8592; Games</a>
    <h1>&#x1F6C1; Wash the Puppy!</h1>
    <div id="hint-top">Scrub! &#x1F9FC;</div>
</div>

<div id="wrap">
<div id="scene">

    <!-- ── PUPPY SVG ── -->
    <svg id="pup" viewBox="0 0 300 384" xmlns="http://www.w3.org/2000/svg">

        <!-- TAIL (wags on win — JS rotates this group around its base) -->
        <g id="tail-g">
            <ellipse cx="254" cy="235" rx="18" ry="52" fill="#c4832a"
                     transform="rotate(38, 228, 268)"/>
            <!-- fluffy tail tip -->
            <ellipse cx="266" cy="196" rx="15" ry="20" fill="#d4923a"
                     transform="rotate(38, 228, 268)"/>
        </g>

        <!-- BODY -->
        <ellipse cx="150" cy="282" rx="105" ry="76" fill="#d4923a"/>

        <!-- HIND PAWS (peeking at sides) -->
        <ellipse cx="57"  cy="334" rx="40" ry="22" fill="#c4832a"/>
        <ellipse cx="243" cy="334" rx="40" ry="22" fill="#c4832a"/>

        <!-- FRONT LEGS -->
        <rect x="82"  y="322" width="48" height="58" rx="24" fill="#d4923a"/>
        <rect x="170" y="322" width="48" height="58" rx="24" fill="#d4923a"/>
        <!-- Paw toes -->
        <ellipse cx="106" cy="376" rx="20" ry="11" fill="#c4832a"/>
        <ellipse cx="194" cy="376" rx="20" ry="11" fill="#c4832a"/>

        <!-- EARS (behind head) -->
        <ellipse cx="82"  cy="132" rx="40" ry="58" fill="#b5722a" transform="rotate(-14,82,132)"/>
        <ellipse cx="218" cy="132" rx="40" ry="58" fill="#b5722a" transform="rotate(14,218,132)"/>
        <!-- Inner ear -->
        <ellipse cx="82"  cy="134" rx="25" ry="40" fill="#cc8840" opacity="0.38" transform="rotate(-14,82,132)"/>
        <ellipse cx="218" cy="134" rx="25" ry="40" fill="#cc8840" opacity="0.38" transform="rotate(14,218,132)"/>

        <!-- HEAD -->
        <circle cx="150" cy="168" r="84" fill="#d4923a"/>

        <!-- BELLY highlight -->
        <ellipse cx="150" cy="290" rx="62" ry="48" fill="#e8c070" opacity="0.28"/>

        <!-- MUZZLE -->
        <ellipse cx="150" cy="212" rx="50" ry="35" fill="#e8c070"/>

        <!-- NOSE -->
        <ellipse cx="150" cy="196" rx="22" ry="14" fill="#1a0800"/>
        <ellipse cx="143" cy="192" rx="7"  ry="5"  fill="rgba(255,255,255,0.32)"/>

        <!-- EYES (white sclera) -->
        <circle cx="110" cy="158" r="20" fill="white"/>
        <circle cx="190" cy="158" r="20" fill="white"/>
        <!-- Iris -->
        <circle cx="113" cy="160" r="13" fill="#3a1a00"/>
        <circle cx="193" cy="160" r="13" fill="#3a1a00"/>
        <!-- Pupil -->
        <circle cx="116" cy="159" r="7"  fill="#080300"/>
        <circle cx="196" cy="159" r="7"  fill="#080300"/>
        <!-- Shine -->
        <circle cx="119" cy="155" r="4.5" fill="white"/>
        <circle cx="199" cy="155" r="4.5" fill="white"/>

        <!-- EYEBROWS (give worried-cute look) -->
        <path d="M 96 140 Q 110 132 126 140"
              stroke="#7a4010" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M 174 140 Q 190 132 204 140"
              stroke="#7a4010" stroke-width="4" fill="none" stroke-linecap="round"/>

        <!-- SMILE -->
        <path d="M 128 220 Q 150 236 172 220"
              stroke="#2a1208" stroke-width="3.5" fill="none" stroke-linecap="round"/>

        <!-- TONGUE -->
        <ellipse cx="150" cy="228" rx="16" ry="13" fill="#ff7090"/>
        <line x1="150" y1="228" x2="150" y2="239"
              stroke="#cc3060" stroke-width="2.5" stroke-linecap="round"/>

        <!-- COLLAR -->
        <path d="M 78 228 Q 150 248 222 228"
              stroke="#3b82f6" stroke-width="11" fill="none" stroke-linecap="round"/>
        <!-- Collar tag -->
        <circle cx="150" cy="241" r="10" fill="#ffd700"/>
        <text x="150" y="245" text-anchor="middle" dominant-baseline="middle"
              fill="#c89000" font-size="10" font-weight="bold">&#9733;</text>

    </svg><!-- end pup SVG -->

    <!-- Mud canvas overlay -->
    <canvas id="mc"></canvas>

    <!-- Floating bubbles -->
    <div id="bubs"></div>

    <!-- Sponge cursor -->
    <div id="sponge">&#x1F9FC;</div>

    <!-- Bottom hint -->
    <div id="scrub-hint">Rub the mud away! &#x1F9FC;</div>

</div><!-- #scene -->
</div><!-- #wrap -->

<!-- Win overlay -->
<div id="win">
    <div class="win-card">
        <div id="win-star">&#11088;</div>
        <div class="win-title">Good Job!</div>
        <div class="win-sub">The puppy is all clean! &#x1F436;</div>
        <button class="wash-btn" id="washBtn">Wash Again!</button>
    </div>
</div>

<!-- Confetti -->
<div class="confetti-wrap" id="confetti"></div>

<script src="shared/kit.js?v=1"></script>
<script>
/* ════════════════════════════════
   ALL DECLARATIONS FIRST — no TDZ
════════════════════════════════ */
const mc       = document.getElementById('mc');
const ctx      = mc.getContext('2d');
const spongeEl = document.getElementById('sponge');
const bubsEl   = document.getElementById('bubs');
const winEl    = document.getElementById('win');
const sceneEl  = document.getElementById('scene');
const tailG    = document.getElementById('tail-g');
const hintEl   = document.getElementById('scrub-hint');

let W = 0, H = 0, dpr = 1;
let phase        = 'SCRUB';    /* SCRUB | WIN */
let scrubbing    = false;
let initOpaque   = 0;          /* pixel count of original mud */
let lastCheck    = 0;          /* timestamp of last clean% sample */
let wagRAF       = 0;
let wagAngle     = 0;
let bubCount     = 0;
let lastBubX     = -999;

const SPONGE_R   = 32;         /* erase radius, CSS px */
const BUB_EVERY  = 5;          /* spawn bubble every N scrub moves */
const WIN_PCT    = 0.90;       /* clean threshold */
const WAG_PIV_X  = 228;        /* tail SVG pivot (where tail meets body) */
const WAG_PIV_Y  = 268;

/* ════════════════
   AUDIO
════════════════ */

function playScrubSound() {
    try {
        const a = Kit.audio();
        const buf = a.createBuffer(1, a.sampleRate * 0.06, a.sampleRate);
        const d   = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.06;
        const src = a.createBufferSource();
        const flt = a.createBiquadFilter();
        const g   = a.createGain();
        src.buffer = buf;
        flt.type = 'bandpass'; flt.frequency.value = 1800; flt.Q.value = 1.2;
        src.connect(flt); flt.connect(g); g.connect(a.destination);
        g.gain.setValueAtTime(1, a.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.06);
        src.start(); src.stop(a.currentTime + 0.06);
    } catch(e){}
}

function playWaterSound() {
    try {
        const a = Kit.audio();
        const buf = a.createBuffer(1, a.sampleRate * 0.9, a.sampleRate);
        const d   = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.18;
        const src = a.createBufferSource();
        const flt = a.createBiquadFilter();
        const g   = a.createGain();
        src.buffer = buf;
        flt.type = 'lowpass'; flt.frequency.value = 900;
        src.connect(flt); flt.connect(g); g.connect(a.destination);
        g.gain.setValueAtTime(0, a.currentTime);
        g.gain.linearRampToValueAtTime(1, a.currentTime + 0.15);
        g.gain.linearRampToValueAtTime(0, a.currentTime + 0.85);
        src.start(); src.stop(a.currentTime + 0.9);
    } catch(e){}
}

function playWinChord() {
    try {
        const a = Kit.audio();
        [523, 659, 784, 1047, 1319].forEach((f, i) => {
            const o = a.createOscillator(), g = a.createGain();
            o.type = 'sine'; o.frequency.value = f;
            o.connect(g); g.connect(a.destination);
            const t0 = a.currentTime + i * 0.08;
            g.gain.setValueAtTime(0.2, t0);
            g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.6);
            o.start(t0); o.stop(t0 + 0.6);
        });
    } catch(e){}
}

/* ════════════════
   MUD LAYER
════════════════ */
function initCanvas() {
    dpr = window.devicePixelRatio || 1;
    const r = sceneEl.getBoundingClientRect();
    W = r.width; H = r.height;
    mc.width  = Math.round(W * dpr);
    mc.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawMud();
    initOpaque = countOpaque();
}

function drawMud() {
    /* Mud patch positions as fractions of scene size */
    const blobs = [
        [0.50, 0.30, 0.17, 0.10],   /* forehead */
        [0.50, 0.42, 0.22, 0.15],   /* face */
        [0.28, 0.40, 0.12, 0.15],   /* left ear */
        [0.72, 0.38, 0.12, 0.13],   /* right ear */
        [0.33, 0.58, 0.16, 0.13],   /* left body */
        [0.67, 0.60, 0.16, 0.12],   /* right body */
        [0.50, 0.68, 0.20, 0.11],   /* belly */
        [0.50, 0.79, 0.13, 0.08],   /* lower body */
    ];
    ctx.save();
    ctx.fillStyle   = '#7a4118';
    ctx.shadowColor = '#3a1a06';
    ctx.shadowBlur  = 10;
    blobs.forEach(([fx, fy, frx, fry]) => drawBlob(fx*W, fy*H, frx*W, fry*H, 7));
    ctx.restore();
}

function drawBlob(cx, cy, rx, ry, pts) {
    ctx.beginPath();
    for (let i = 0; i <= pts; i++) {
        const a = (i / pts) * Math.PI * 2;
        const j = 0.65 + Math.random() * 0.62;
        const x = cx + Math.cos(a) * rx * j;
        const y = cy + Math.sin(a) * ry * j;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
}

function countOpaque() {
    /* Sample every 4th pixel — alpha > 8 = mud still there */
    const d = ctx.getImageData(0, 0, mc.width, mc.height).data;
    let n = 0;
    for (let i = 3; i < d.length; i += 16) if (d[i] > 8) n++;
    return n;
}

/* ════════════════
   SCRUBBING
════════════════ */
function scrub(x, y) {
    /* Erase a circle of mud */
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x, y, SPONGE_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    /* Sponge position */
    spongeEl.style.left = x + 'px';
    spongeEl.style.top  = y + 'px';

    /* Scrub sound (throttled) */
    if (Math.abs(x - lastBubX) > 18) {
        playScrubSound();
        lastBubX = x;
    }

    /* Bubble (every N scrubs) */
    bubCount++;
    if (bubCount % BUB_EVERY === 0) spawnBubble(x, y);
}

function spawnBubble(x, y) {
    const b  = document.createElement('div');
    b.className = 'bub';
    const sz = 12 + Math.random() * 18;
    b.style.cssText = `left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;`;
    bubsEl.appendChild(b);
    b.addEventListener('animationend', () => b.remove(), { once: true });
}

/* ════════════════
   TOUCH / MOUSE
════════════════ */
function toScene(clientX, clientY) {
    const r = mc.getBoundingClientRect();
    return { x: clientX - r.left, y: clientY - r.top };
}

mc.addEventListener('touchstart', e => {
    e.preventDefault();
    if (phase !== 'SCRUB') return;
    scrubbing = true;
    spongeEl.style.display = 'block';
    hintEl.style.display   = 'none';
    const {x, y} = toScene(e.touches[0].clientX, e.touches[0].clientY);
    scrub(x, y);
}, { passive: false });

mc.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!scrubbing || phase !== 'SCRUB') return;
    const {x, y} = toScene(e.touches[0].clientX, e.touches[0].clientY);
    scrub(x, y);
    checkClean();
}, { passive: false });

mc.addEventListener('touchend', () => {
    scrubbing = false;
    spongeEl.style.display = 'none';
});

mc.addEventListener('mousedown', e => {
    if (phase !== 'SCRUB') return;
    scrubbing = true;
    spongeEl.style.display = 'block';
    hintEl.style.display   = 'none';
    scrub(e.offsetX, e.offsetY);
});
mc.addEventListener('mousemove', e => {
    if (!scrubbing || phase !== 'SCRUB') return;
    scrub(e.offsetX, e.offsetY);
    checkClean();
});
mc.addEventListener('mouseup',    () => { scrubbing = false; spongeEl.style.display = 'none'; });
mc.addEventListener('mouseleave', () => { scrubbing = false; spongeEl.style.display = 'none'; });

/* ════════════════
   CLEAN CHECK
════════════════ */
function checkClean() {
    const now = Date.now();
    if (now - lastCheck < 350) return;
    lastCheck = now;
    const cur = countOpaque();
    const pct = initOpaque > 0 ? 1 - cur / initOpaque : 0;
    if (pct >= WIN_PCT) onWin();
}

/* ════════════════
   WIN SEQUENCE
════════════════ */
function onWin() {
    if (phase !== 'SCRUB') return;
    phase = 'WIN';
    scrubbing = false;
    spongeEl.style.display = 'none';
    mc.style.pointerEvents = 'none';

    /* Wipe remaining mud */
    ctx.clearRect(0, 0, W, H);

    /* Water spray */
    sprayWater();
    playWaterSound();

    /* Start tail wag */
    startWag();

    /* Show win card after water clears */
    setTimeout(() => {
        winEl.classList.add('show');
        playWinChord();
        Kit.confetti(90);
    }, 900);
}

function sprayWater() {
    const layer = document.createElement('div');
    layer.style.cssText = 'position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:30;';
    sceneEl.appendChild(layer);

    for (let i = 0; i < 55; i++) {
        const d = document.createElement('div');
        d.className = 'wdrop';
        const ht = 8 + Math.random() * 16;
        const delay = (Math.random() * 0.5).toFixed(2);
        const dur   = (0.35 + Math.random() * 0.35).toFixed(2);
        d.style.cssText =
            `left:${(Math.random() * 100).toFixed(1)}%;` +
            `width:${(2 + Math.random() * 3).toFixed(1)}px;height:${ht}px;` +
            `animation:wrain ${dur}s ease-in ${delay}s forwards;`;
        layer.appendChild(d);
    }
    setTimeout(() => layer.remove(), 1300);
}

/* ════════════════
   TAIL WAG
════════════════ */
function startWag() {
    wagAngle = 0;
    function step() {
        wagAngle += 7;
        const deg = Math.sin(wagAngle * Math.PI / 180) * 30;
        tailG.setAttribute('transform', `rotate(${deg},${WAG_PIV_X},${WAG_PIV_Y})`);
        if (phase === 'WIN') wagRAF = requestAnimationFrame(step);
    }
    wagRAF = requestAnimationFrame(step);
}

/* ════════════════
   CONFETTI
════════════════ */

/* ════════════════
   RESTART
════════════════ */
function restart() {
    cancelAnimationFrame(wagRAF);
    tailG.setAttribute('transform', '');
    winEl.classList.remove('show');
    document.getElementById('confetti').innerHTML = '';
    ctx.clearRect(0, 0, W, H);
    phase       = 'SCRUB';
    bubCount    = 0;
    lastCheck   = 0;
    lastBubX    = -999;
    mc.style.pointerEvents = 'auto';
    hintEl.style.display   = '';
    drawMud();
    initOpaque = countOpaque();
}

document.getElementById('washBtn').addEventListener('click', restart);

/* ════════════════
   BOOT
════════════════ */
initCanvas();
window.addEventListener('resize', () => {
    if (phase === 'SCRUB') {
        const snap = mc.toDataURL();
        const oldW = W, oldH = H;
        const r = sceneEl.getBoundingClientRect();
        W = r.width; H = r.height;
        mc.width  = Math.round(W * dpr);
        mc.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const img = new Image();
        img.onload = () => { ctx.drawImage(img, 0, 0, W, H); initOpaque = countOpaque(); };
        img.src = snap;
    }
});
</script>
</body>
</html>
